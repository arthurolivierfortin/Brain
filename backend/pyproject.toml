[project]
name = "brain"
version = "0.1.0"
description = "Drop-in AI memory system for LLM apps and agents"
readme = "../README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "chromadb>=0.5.0",
    "fastembed>=0.3.0",
    "mcp[cli]>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.6.0",
    "httpx>=0.27.0",
]

[project.scripts]
brain = "brain.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "SIM"]
ignore = ["S101", "E501", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
mypy_path = "src"
# Phase 1 = extraction from Money legacy. mypy strict disabled here (82 errs strict,
# 36 with check_untyped_defs). 143/143 pytest pass = functional correctness.
# Strict re-enablement tracked in docs/improvements.md (P2).
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["src"]
