<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>brain · live monitor</title>
  <style>
    :root {
      --bg: #0b0b0f;
      --fg: #c5c8d3;
      --accent: #6fd6c9;
      --mem: #b48ead;
      --swap: #ebcb8b;
      --ok: #a3be8c;
      --err: #bf616a;
      --dim: #5d6478;
      --l2: #c278d6;
      --font: "JetBrains Mono", ui-monospace, "Cascadia Code", monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 13px; }
    #root {
      display: grid;
      grid-template-columns: 280px 1fr 320px;
      grid-template-rows: auto 1fr 180px;
      height: 100vh;
    }
    .brain-shell { display: contents; }
    .header-row { grid-column: 1 / -1; }
    .footer-row { grid-column: 1 / -1; }
    .left-panel { display: flex; flex-direction: column; gap: 8px; padding: 8px; min-height: 0; border-right: 1px solid rgba(255,255,255,0.05); }
    .thought-stream {
      border-left: 1px solid rgba(255,255,255,0.05);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .cluster-meters .meter-row { display: grid; grid-template-columns: 80px 1fr auto auto; gap: 6px; align-items: center; height: 24px; font-size: 11px; }
    .cluster-meters .meter-bar { height: 6px; border-radius: 3px; background: #1a1d28; overflow: hidden; }
    .cluster-meters .meter-bar > span { display: block; height: 100%; }
    .cluster-meters .trend-up { color: var(--accent); }
    .cluster-meters .trend-down { color: var(--err); }
    .cluster-meters .trend-flat { color: var(--dim); }
    .top-accessed { flex: 1; min-height: 0; overflow-y: auto; list-style: none; padding: 0; margin: 0; }
    .top-accessed li { display: grid; grid-template-columns: 8px 1fr auto; gap: 6px; align-items: center; padding: 4px 6px; cursor: pointer; font-size: 11px; }
    .top-accessed li:hover { background: #161922; }
    .top-accessed li.focused { background: #1f2433; outline: 1px solid var(--accent); }
    .top-accessed .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .top-accessed .access-badge { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 10px; }
    .tab-bar { display: flex; gap: 4px; padding: 4px 8px; border-bottom: 1px solid #1a1d28; }
    .tab-bar button { background: transparent; border: 1px solid #2a2f3d; color: var(--fg); padding: 2px 10px; cursor: pointer; font-family: inherit; font-size: 11px; }
    .tab-bar button.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
    .center-area { display: flex; flex-direction: column; min-height: 0; }
    .center-area > .tab-content { flex: 1; min-height: 0; position: relative; }
    .matrix-view { width: 100%; height: 100%; position: relative; }
    .matrix-view .cell-overlay { position: absolute; background: #1a1d28; border: 1px solid #2a2f3d; padding: 6px 8px; font-size: 11px; pointer-events: none; white-space: pre; }
    .console-wrap { position: relative; height: 100%; }
    .console-wrap pre { height: 100%; margin: 0; padding: 6px 8px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; font-size: 10px; line-height: 1.4; background: #08090d; }
    .console-line.console-green { color: var(--ok); }
    .console-line.console-cyan { color: var(--accent); }
    .console-line.console-yellow { color: var(--swap); }
    .console-line.console-red { color: var(--err); }
    .console-line.console-grey { color: var(--dim); }
    .follow-pill { position: absolute; top: 8px; right: 8px; background: var(--accent); color: var(--bg); border: none; padding: 2px 8px; cursor: pointer; font-family: inherit; font-size: 10px; }
    .footer-search { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .footer-search input { background: #08090d; border: 1px solid #2a2f3d; color: var(--fg); padding: 2px 6px; font-family: inherit; font-size: 11px; min-width: 200px; outline: none; }
    .footer-search .matches-badge { color: var(--dim); font-size: 10px; font-variant-numeric: tabular-nums; }
  </style>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ── helpers ──────────────────────────────────────────────────────────────────
    function formatRelative(iso) {
      const diffSec = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
      if (diffSec < 60) return `${diffSec}s ago`;
      if (diffSec < 3600) return `${Math.floor(diffSec / 60)}m ago`;
      return `${Math.floor(diffSec / 3600)}h ago`;
    }

    function formatUptime(startMs) {
      const totalSec = Math.floor((Date.now() - startMs) / 1000);
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      return `${h}h:${String(m).padStart(2, "0")}m`;
    }

    function classifyEvent(eventType) {
      const t = eventType ?? '';
      if (t === 'hook_wake_up') return 'green';
      if (t === 'hook_post_turn') return 'cyan';
      if (t.includes('reject')) return 'yellow';
      if (t.includes('error') || t.includes('failed')) return 'red';
      return 'grey';
    }

    // ── Layer helpers ─────────────────────────────────────────────────────────────
    function tagToLayer(tags) {
      const parts = (tags ?? '').split(',').map(s => s.trim());
      if (parts.includes('identity')) return 'L0';
      if (parts.includes('preference')) return 'L1';
      return null;
    }

    function inferLayer(node, l2RecentsMap) {
      if (l2RecentsMap && l2RecentsMap.has(node.id) && l2RecentsMap.get(node.id) > Date.now()) {
        return 'L2';
      }
      return tagToLayer(node.tags ?? '');
    }

    function layerRingColor(layer) {
      if (layer === 'L0') return '#dec56f';
      if (layer === 'L1') return '#6fd6c9';
      if (layer === 'L2') return '#c278d6';
      return null;
    }

    function useL2Recents(events) {
      return React.useMemo(() => {
        const map = new Map();
        const wakeUp = (events ?? []).find(e => e.event_type === 'hook_wake_up');
        if (!wakeUp) return map;
        const ids = wakeUp.metadata?.memory_ids?.L2 ?? [];
        const expiry = new Date(wakeUp.timestamp).getTime() + 60000;
        if (expiry <= Date.now()) return map;
        for (const id of ids) {
          map.set(id, expiry);
        }
        return map;
      }, [events]);
    }

    // ── Bar component ─────────────────────────────────────────────────────────────
    function Bar({ label, value, max, color, redZone }) {
      const pct = Math.min(1, value / Math.max(max, 1));
      const isRed = redZone && value > redZone;
      return (
        <div style={{ display: "flex", alignItems: "center", gap: "6px", marginBottom: "2px" }}>
          <span style={{ width: "90px", textAlign: "right", color: "var(--fg)", opacity: 0.7 }}>{label}</span>
          <div style={{ flex: 1, height: "10px", background: "rgba(255,255,255,0.07)", borderRadius: "2px" }}>
            <div style={{
              width: `${(pct * 100).toFixed(1)}%`,
              height: "100%",
              background: isRed ? "var(--err)" : color,
              borderRadius: "2px",
              transition: "width 0.4s",
            }} />
          </div>
          <span style={{ width: "40px", fontSize: "11px", opacity: 0.8 }}>
            {(pct * 100).toFixed(0)}%
          </span>
        </div>
      );
    }

    // ── Header ────────────────────────────────────────────────────────────────────
    function Header({ stats, queue, lastError, startMs, buckets, events, tab, setTab, tweaks, setTweaks }) {
      const types = Object.entries(stats?.types ?? {})
        .sort(([, a], [, b]) => b - a)
        .slice(0, 8);
      const extra = Object.keys(stats?.types ?? {}).length - 8;
      const total = stats?.total ?? 0;

      const eventsLast60s = (events ?? []).filter(
        e => Date.now() - new Date(e.timestamp).getTime() < 60000
      );

      return (
        <header className="header-row" style={{
          padding: "10px 16px",
          borderBottom: "1px solid rgba(255,255,255,0.08)",
          background: "rgba(255,255,255,0.02)",
          display: "flex",
          gap: "24px",
          alignItems: "flex-start",
        }}>
          {/* LEFT: cluster cores + mem/swap */}
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ marginBottom: "6px" }}>
              {types.map(([type, count]) => (
                <Bar
                  key={type}
                  label={type}
                  value={count}
                  max={total || 1}
                  color="var(--accent)"
                />
              ))}
              {extra > 0 && (
                <div style={{ fontSize: "11px", opacity: 0.5, paddingLeft: "96px" }}>+{extra} more types</div>
              )}
            </div>
            <Bar label="mem" value={total} max={16384} color="var(--mem)" />
            <Bar label="swap" value={queue?.pending ?? 0} max={100} color="var(--swap)" redZone={100} />
          </div>

          {/* RIGHT: identity + stats + tabs + status */}
          <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: "6px", flexShrink: 0 }}>
            <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>
              <span style={{ color: "var(--accent)", fontWeight: "bold", letterSpacing: "0.05em" }}>brain</span>
              <span style={{ color: "var(--dim)", fontSize: "11px" }}>v0.2 · pid 1</span>
            </div>
            {(() => {
              const lastWakeUp = (events ?? []).find(e => e.event_type === 'hook_wake_up');
              const l2Count = lastWakeUp?.metadata?.memory_ids?.L2?.length ?? 0;
              const clickable = l2Count > 0 && lastWakeUp?.event_id;
              return (
                <span
                  style={{
                    padding: "1px 6px",
                    borderRadius: "3px",
                    background: l2Count > 0 ? "var(--l2)" : "rgba(255,255,255,0.05)",
                    color: l2Count > 0 ? "#000" : "var(--dim)",
                    cursor: clickable ? "pointer" : "default",
                    fontSize: "11px",
                    fontVariantNumeric: "tabular-nums",
                  }}
                  onClick={() => {
                    if (clickable) window.location.hash = '#/hook/' + lastWakeUp.event_id;
                  }}
                >
                  L2: {l2Count}
                </span>
              );
            })()}
            <div style={{ fontSize: "11px", color: "var(--dim)" }}>
              up {formatUptime(startMs)} · thoughts {(events ?? []).length} · evt/s {(eventsLast60s.length / 60).toFixed(1)}
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
              <ActivitySparkline buckets={buckets} />
              <span style={{
                width: "8px", height: "8px", borderRadius: "50%",
                background: lastError ? "var(--err)" : "var(--ok)",
                display: "inline-block",
              }} title={lastError ?? "ok"} />
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: "6px", fontSize: "11px" }}>
              <span style={{ color: "var(--dim)" }}>agent:</span>
              <select
                value={tweaks?.agentFilter ?? 'all'}
                onChange={e => setTweaks(t => ({ ...t, agentFilter: e.target.value }))}
                style={{ background: "#222", color: "var(--fg)", border: "1px solid rgba(255,255,255,0.15)", fontFamily: "inherit", fontSize: "11px", padding: "1px 4px" }}
              >
                {['all', ...new Set((events ?? []).map(e => e.agent).filter(Boolean))].sort().map(a => (
                  <option key={a} value={a}>{a}</option>
                ))}
              </select>
            </div>
            <div className="tab-bar" style={{ padding: 0, borderBottom: "none" }}>
              {['graph', 'matrix', 'console'].map(name => (
                <button
                  key={name}
                  className={tab === name ? 'active' : ''}
                  onClick={() => setTab(name)}
                >
                  {name}
                </button>
              ))}
            </div>
          </div>
        </header>
      );
    }

    // ── Footer ─────────────────────────────────────────────────────────────────────
    function Footer({ events, searchRef }) {
      const [filter, setFilter] = React.useState('');
      const filtered = filter === '' ? (events ?? []) : (events ?? []).filter(
        e => JSON.stringify(e).toLowerCase().includes(filter.toLowerCase())
      );

      return (
        <footer className="footer-row" style={{
          borderTop: "1px solid rgba(255,255,255,0.08)",
          overflowY: "auto",
          padding: "0",
        }}>
          <div className="footer-search">
            <input
              type="search"
              placeholder="filter…"
              ref={searchRef}
              value={filter}
              onChange={e => setFilter(e.target.value)}
            />
            <span className="matches-badge">{filtered.length} / {(events ?? []).length} matches</span>
          </div>
          {filtered.map((ev, i) => {
            const type = ev.event_type ?? "";
            let badgeColor = "#555";
            if (type === "hook_wake_up") badgeColor = "var(--ok)";
            else if (type === "hook_post_turn") badgeColor = "var(--accent)";
            else if (type.includes("reject")) badgeColor = "var(--swap)";
            else if (type.includes("error") || type.includes("failed")) badgeColor = "var(--err)";

            const details = (ev.details ?? "").slice(0, 120);
            return (
              <div key={i} style={{ display: "flex", gap: "8px", padding: "2px 12px", fontSize: "12px", borderBottom: "1px solid rgba(255,255,255,0.04)" }}>
                <span style={{ padding: "0 4px", borderRadius: "2px", background: badgeColor, color: "#000", flexShrink: 0, fontSize: "10px" }}>
                  {type}
                </span>
                <span style={{ opacity: 0.7, flexShrink: 0 }}>{ev.agent ?? ""}</span>
                <span style={{ flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                  {details}
                </span>
                <span style={{ opacity: 0.5, flexShrink: 0, fontSize: "11px" }}>
                  {formatRelative(ev.timestamp)}
                </span>
              </div>
            );
          })}
        </footer>
      );
    }

    // ── TweaksPanel ────────────────────────────────────────────────────────────────
    const TWEAK_DEFAULTS = { accent: '#6fd6c9', speed: 1, running: true, tab: 'graph', animations: true, agentFilter: 'all', matrixSubview: 'types' };
    const STORAGE_KEY = 'brain-monitor-tweaks-v1';
    const ANIM_CAP = 20;
    let warnedAboutStorage = false;

    function readStoredTweaks(defaults) {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaults;
        const parsed = JSON.parse(raw);
        return { ...defaults, ...parsed };
      } catch (err) {
        if (!warnedAboutStorage) {
          console.warn('[brain-monitor] localStorage unavailable; tweaks will not persist this session');
          warnedAboutStorage = true;
        }
        return defaults;
      }
    }

    function useTweaks(defaults) {
      const [tweaks, setTweaksRaw] = useState(() => readStoredTweaks(defaults));
      const setTweaks = React.useCallback((updater) => {
        setTweaksRaw(prev => {
          const next = typeof updater === 'function' ? updater(prev) : updater;
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
          } catch (err) {
            if (!warnedAboutStorage) {
              console.warn('[brain-monitor] localStorage unavailable; tweaks will not persist this session');
              warnedAboutStorage = true;
            }
          }
          return next;
        });
      }, []);
      useEffect(() => {
        document.documentElement.style.setProperty('--accent', tweaks.accent);
      }, [tweaks.accent]);
      return { tweaks, setTweaks };
    }

    function TweaksPanel({ tweaks, setTweaks, open, setOpen }) {
      return (
        <div style={{ position: "fixed", bottom: "190px", right: "12px", zIndex: 100 }}>
          <button
            onClick={() => setOpen(o => !o)}
            style={{ background: "var(--accent)", color: "#000", border: "none", borderRadius: "4px", padding: "4px 10px", cursor: "pointer", fontFamily: "var(--font)", fontSize: "12px" }}
          >
            {open ? "close" : "tweaks"}
          </button>
          {open && (
            <div style={{ marginTop: "6px", background: "#1a1a22", border: "1px solid rgba(255,255,255,0.12)", borderRadius: "6px", padding: "10px 14px", display: "flex", flexDirection: "column", gap: "8px", minWidth: "180px" }}>
              <label style={{ display: "flex", alignItems: "center", gap: "8px" }}>
                <input
                  type="checkbox"
                  checked={tweaks.running}
                  onChange={e => setTweaks(t => ({ ...t, running: e.target.checked }))}
                />
                polling on
              </label>
              <label style={{ display: "flex", alignItems: "center", gap: "8px" }}>
                speed
                <select
                  value={tweaks.speed}
                  onChange={e => setTweaks(t => ({ ...t, speed: Number(e.target.value) }))}
                  style={{ background: "#222", color: "var(--fg)", border: "1px solid rgba(255,255,255,0.15)", borderRadius: "3px" }}
                >
                  <option value={0.5}>0.5×</option>
                  <option value={1}>1×</option>
                  <option value={2}>2×</option>
                </select>
              </label>
              <label style={{ display: "flex", alignItems: "center", gap: "8px" }}>
                accent
                <input
                  type="color"
                  value={tweaks.accent}
                  onChange={e => setTweaks(t => ({ ...t, accent: e.target.value }))}
                />
              </label>
              <label style={{ display: "flex", alignItems: "center", gap: "8px" }}>
                <input
                  type="checkbox"
                  checked={tweaks.animations !== false}
                  onChange={e => setTweaks(t => ({ ...t, animations: e.target.checked }))}
                />
                animations
              </label>
            </div>
          )}
        </div>
      );
    }

    // ── Hooks ──────────────────────────────────────────────────────────────────────
    function useStats(speed, paused) {
      const [state, setState] = useState({ stats: null, queue: null, lastError: null });
      useEffect(() => {
        if (paused) return;
        const ctrl = new AbortController();
        const intervalMs = Math.round(5000 / speed);

        async function fetchData() {
          try {
            const [sr, qr] = await Promise.all([
              fetch("/stats", { signal: ctrl.signal }),
              fetch("/queue/status", { signal: ctrl.signal }),
            ]);
            const [statsData, queueData] = await Promise.all([sr.json(), qr.json()]);
            setState({ stats: statsData, queue: queueData, lastError: null });
          } catch (err) {
            if (err.name !== "AbortError") {
              setState(s => ({ ...s, lastError: err.message }));
            }
          }
        }

        fetchData();
        const id = setInterval(fetchData, intervalMs);
        return () => { clearInterval(id); ctrl.abort(); };
      }, [speed, paused]);
      return state;
    }

    // ── useThoughts ──────────────────────────────────────────────────────────────
    function useThoughts(speed, paused, nodeSet, activatedAtRef) {
      const [state, setState] = useState({ events: [], lastError: null });
      const prevEventsRef = useRef([]);

      useEffect(() => {
        if (paused) return;
        const ctrl = new AbortController();
        const intervalMs = Math.round(2000 / speed);

        async function fetchData() {
          try {
            const r = await fetch('/events?limit=20', { signal: ctrl.signal });
            const data = await r.json();
            const newEvents = [...(data.events ?? [])].reverse();

            const prevSet = new Set(prevEventsRef.current.map(e => e.timestamp));
            for (const ev of newEvents) {
              if (prevSet.has(ev.timestamp)) continue;
              const entryId = ev.metadata?.entry_id ?? (ev.node_id || null);
              if (entryId && nodeSet.has(entryId)) {
                activatedAtRef.current[entryId] = Date.now();
              }
            }
            prevEventsRef.current = newEvents;
            setState({ events: newEvents, lastError: null });
          } catch (err) {
            if (err.name !== 'AbortError') {
              setState(s => ({ ...s, lastError: err.message }));
            }
          }
        }

        fetchData();
        const id = setInterval(fetchData, intervalMs);
        return () => { clearInterval(id); ctrl.abort(); };
      }, [speed, paused, nodeSet]);

      return state;
    }

    // ── useTimeline ───────────────────────────────────────────────────────────────
    function useTimeline() {
      const [state, setState] = useState({ buckets: [], lastError: null });

      useEffect(() => {
        const ctrl = new AbortController();

        async function fetchData() {
          if (document.hidden) return;
          try {
            const r = await fetch('/events/timeline', { signal: ctrl.signal });
            const data = await r.json();
            setState({ buckets: data.timeline ?? [], lastError: null });
          } catch (err) {
            if (err.name !== 'AbortError') {
              setState(s => ({ ...s, lastError: err.message }));
            }
          }
        }

        fetchData();
        const id = setInterval(fetchData, 60000);
        return () => { clearInterval(id); ctrl.abort(); };
      }, []);

      return state;
    }

    // ── ActivitySparkline ─────────────────────────────────────────────────────────
    function ActivitySparkline({ buckets }) {
      const [tooltip, setTooltip] = useState(null);

      if (!buckets || buckets.length === 0) {
        return (
          <svg viewBox="0 0 120 16" width="120" height="16" style={{ flexShrink: 0 }}>
            <rect width="120" height="16" fill="var(--dim)" opacity="0.2" />
          </svg>
        );
      }

      const TYPES = ['archived', 'merged', 'reinforced', 'searched', 'stored'];
      const COLORS = {
        stored:     'var(--ok)',
        searched:   'var(--accent)',
        reinforced: '#7da9d8',
        merged:     'var(--swap)',
        archived:   'var(--dim)',
      };

      const totals = buckets.map(b => TYPES.reduce((s, t) => s + (b[t] ?? 0), 0));
      const maxTotal = Math.max(1, ...totals);

      const allZero = totals.every(t => t === 0);
      if (allZero) {
        return (
          <svg viewBox="0 0 120 16" width="120" height="16" style={{ flexShrink: 0 }}>
            <rect width="120" height="16" fill="var(--dim)" opacity="0.2" />
          </svg>
        );
      }

      const bars = buckets.map((b, i) => {
        const barX = i * 5;
        let yOff = 16;
        const rects = [];
        for (const t of TYPES) {
          const count = b[t] ?? 0;
          if (count === 0) continue;
          const h = (count / maxTotal) * 16;
          yOff -= h;
          rects.push(<rect key={t} x={barX} y={yOff} width="4" height={h} fill={COLORS[t]} />);
        }
        return (
          <g key={i}
            onMouseEnter={() => setTooltip({ i, x: barX, b })}
            onMouseLeave={() => setTooltip(null)}
            style={{ cursor: 'default' }}
          >
            {rects}
          </g>
        );
      });

      return (
        <div style={{ position: 'relative', display: 'inline-block' }}>
          <svg viewBox="0 0 120 16" width="120" height="16" style={{ flexShrink: 0, display: 'block' }}>
            {bars}
          </svg>
          {tooltip && (
            <div style={{
              position: 'absolute', bottom: '20px', left: `${tooltip.x}px`,
              background: 'rgba(10,10,18,0.95)', border: '1px solid rgba(255,255,255,0.15)',
              borderRadius: '3px', padding: '4px 6px', fontSize: '10px', whiteSpace: 'nowrap',
              pointerEvents: 'none', zIndex: 10,
            }}>
              {TYPES.filter(t => tooltip.b[t] > 0).map(t => (
                <div key={t}>{t}: {tooltip.b[t]}</div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function useEvents(speed, paused) {
      const [state, setState] = useState({ events: [], lastError: null });
      useEffect(() => {
        if (paused) return;
        const ctrl = new AbortController();
        const intervalMs = Math.round(2000 / speed);

        async function fetchData() {
          try {
            const r = await fetch("/events?limit=200", { signal: ctrl.signal });
            const data = await r.json();
            setState({ events: [...(data.events ?? [])].reverse(), lastError: null });
          } catch (err) {
            if (err.name !== "AbortError") {
              setState(s => ({ ...s, lastError: err.message }));
            }
          }
        }

        fetchData();
        const id = setInterval(fetchData, intervalMs);
        return () => { clearInterval(id); ctrl.abort(); };
      }, [speed, paused]);
      return state;
    }

    // ── paletteFor ───────────────────────────────────────────────────────────────
    function paletteFor(memoryType) {
      const P = {
        fact:         '#6fd6c9',
        preference:   '#b48ead',
        context:      '#ebcb8b',
        decision:     '#a3be8c',
        event:        '#88c0d0',
        strategy:     '#d08770',
        relationship: '#bf616a',
      };
      return P[memoryType] ?? '#5d6478';
    }

    // ── useGraph ─────────────────────────────────────────────────────────────────
    function useGraph() {
      const [state, setState] = React.useState({
        nodes: [], edges: [], lastError: null, lastFetchedAt: null, isLoading: false,
      });
      const fetchRef = React.useRef(null);

      function doFetch() {
        if (fetchRef.current) fetchRef.current.abort();
        const ctrl = new AbortController();
        fetchRef.current = ctrl;
        setState(s => ({ ...s, isLoading: true }));

        fetch('/graph', { signal: ctrl.signal })
          .then(r => r.json())
          .then(data => {
            const rawEntries = data.entries ?? [];
            if (rawEntries.length > 500) {
              setState({ nodes: [], edges: [], lastError: 'graph too large', lastFetchedAt: Date.now(), isLoading: false });
              return;
            }
            const nodeSet = new Set(rawEntries.map(e => e.id));
            const nodes = rawEntries.map(e => ({
              id: e.id,
              memory_type: e.memory_type,
              agent: e.agent ?? '∅',
              content: e.content ?? '',
              tags: e.metadata?.tags ?? '',
              links: e.links ?? '',
              color: paletteFor(e.memory_type),
              size: 4 + Math.log((e.access_count ?? 0) + 1) * 2,
              access_count: e.access_count ?? 0,
              x: (Math.random() - 0.5) * 200,
              y: (Math.random() - 0.5) * 200,
              vx: 0, vy: 0,
              fx: null, fy: null,
            }));
            const seen = new Set();
            const edges = [];
            rawEntries.forEach(e => {
              const linkIds = e.links ? e.links.split(',').map(s => s.trim()).filter(Boolean) : [];
              linkIds.forEach(lid => {
                if (!nodeSet.has(lid)) return;
                const key = e.id < lid ? `${e.id}|${lid}` : `${lid}|${e.id}`;
                if (seen.has(key)) return;
                seen.add(key);
                edges.push([e.id < lid ? e.id : lid, e.id < lid ? lid : e.id]);
              });
            });
            setState({ nodes, edges, lastError: null, lastFetchedAt: Date.now(), isLoading: false });
          })
          .catch(err => {
            if (err.name === 'AbortError') return;
            setState(s => ({ ...s, lastError: err.message, isLoading: false }));
          });
      }

      React.useEffect(() => {
        doFetch();
        return () => { if (fetchRef.current) fetchRef.current.abort(); };
      }, []);

      return { ...state, refresh: doFetch };
    }

    // ── simulate ──────────────────────────────────────────────────────────────────
    function simulate(nodes, edges, size, dragNode, nodeById) {
      const cx = size.w / 2, cy = size.h / 2;
      const REPULSE_SAME = 220;
      const REPULSE_CROSS = 380;
      const SPRING_K = 0.02;
      const CENTER_K = 0.0005;
      const CLUSTER_K = 0.001;
      const DAMP = 0.85;
      const DT = 0.5;
      const MARGIN = 30;

      for (let i = 0; i < nodes.length; i++) {
        const a = nodes[i];
        for (let j = i + 1; j < nodes.length; j++) {
          const b = nodes[j];
          let dx = a.x - b.x, dy = a.y - b.y;
          let d2 = dx * dx + dy * dy;
          if (d2 < 0.01) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d2 = 1; }
          const sameType = a.memory_type === b.memory_type;
          const k = sameType ? REPULSE_SAME : REPULSE_CROSS;
          const f = k / d2;
          const d = Math.sqrt(d2);
          a.vx += (dx / d) * f; a.vy += (dy / d) * f;
          b.vx -= (dx / d) * f; b.vy -= (dy / d) * f;
        }
      }

      for (const [aId, bId] of edges) {
        const a = nodeById.get(aId), b = nodeById.get(bId);
        if (!a || !b) continue;
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.sqrt(dx * dx + dy * dy) || 1;
        const target = 80 + (a.size + b.size) / 2;
        const f = (d - target) * SPRING_K;
        a.vx += (dx / d) * f; a.vy += (dy / d) * f;
        b.vx -= (dx / d) * f; b.vy -= (dy / d) * f;
      }

      for (const n of nodes) {
        n.vx += (cx - n.x) * CENTER_K;
        n.vy += (cy - n.y) * CENTER_K;
      }

      const sums = {};
      for (const n of nodes) {
        const s = sums[n.memory_type] ??= { x: 0, y: 0, n: 0 };
        s.x += n.x; s.y += n.y; s.n += 1;
      }
      for (const t of Object.keys(sums)) {
        sums[t].x /= sums[t].n; sums[t].y /= sums[t].n;
      }
      for (const n of nodes) {
        const s = sums[n.memory_type];
        n.vx += (s.x - n.x) * CLUSTER_K;
        n.vy += (s.y - n.y) * CLUSTER_K;
      }

      for (const n of nodes) {
        if (n === dragNode || n.fx != null) {
          n.x = n.fx; n.y = n.fy; n.vx = 0; n.vy = 0; continue;
        }
        n.vx *= DAMP; n.vy *= DAMP;
        n.x += n.vx * DT; n.y += n.vy * DT;
        if (n.x < MARGIN) n.vx += (MARGIN - n.x) * 0.05;
        if (n.x > size.w - MARGIN) n.vx += (size.w - MARGIN - n.x) * 0.05;
        if (n.y < MARGIN) n.vy += (MARGIN - n.y) * 0.05;
        if (n.y > size.h - MARGIN) n.vy += (size.h - MARGIN - n.y) * 0.05;
      }
    }

    // ── render ────────────────────────────────────────────────────────────────────
    function render(ctx, nodes, edges, view, activatedAt, focus, nodeById, l2Recents, pendingAnimsRef, animationsEnabled) {
      const now = Date.now();
      ctx.save();
      ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
      ctx.translate(view.x, view.y);
      ctx.scale(view.k, view.k);

      let edgeFocusSet = null;
      if (focus) {
        edgeFocusSet = new Set([focus]);
        for (const [aId, bId] of edges) {
          if (aId === focus) edgeFocusSet.add(bId);
          if (bId === focus) edgeFocusSet.add(aId);
        }
      }

      ctx.lineWidth = 1;
      for (const [aId, bId] of edges) {
        const a = nodeById.get(aId), b = nodeById.get(bId);
        if (!a || !b) continue;
        const inFocus = focus && (focus === aId || focus === bId);
        const eitherActive = (now - (activatedAt[aId] ?? 0) < 5000) || (now - (activatedAt[bId] ?? 0) < 5000);
        ctx.globalAlpha = focus ? (inFocus ? 0.9 : 0.05) : (eitherActive ? 0.5 : 0.15);
        ctx.strokeStyle = a.memory_type === b.memory_type ? a.color : '#3a3f4d';
        ctx.beginPath();
        ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }

      for (const n of nodes) {
        const t = activatedAt[n.id];
        if (!t) continue;
        const age = now - t;
        if (age >= 5000) continue;
        ctx.globalAlpha = 1 - age / 5000;
        ctx.fillStyle = n.color;
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.size + 6, 0, Math.PI * 2);
        ctx.fill();
      }

      const edgeSetTouchingFocus = edgeFocusSet;
      for (const n of nodes) {
        const dim = focus && focus !== n.id && !(edgeSetTouchingFocus && edgeSetTouchingFocus.has(n.id));
        ctx.globalAlpha = dim ? 0.18 : 1;
        ctx.fillStyle = n.color;
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.size, 0, Math.PI * 2);
        ctx.fill();
        if (focus === n.id) {
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      }

      // Layer ring pass — drawn after node fill so rings visually surround nodes
      const safeL2 = l2Recents ?? new Map();
      for (const n of nodes) {
        const layer = inferLayer(n, safeL2);
        const ringColor = layerRingColor(layer);
        if (!ringColor) continue;
        const dim = focus && focus !== n.id && !(edgeSetTouchingFocus && edgeSetTouchingFocus.has(n.id));
        ctx.globalAlpha = dim ? 0.18 : 1;
        ctx.strokeStyle = ringColor;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.size + 3, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Animation pass — only when animations enabled
      if (animationsEnabled && pendingAnimsRef) {
        const now2 = Date.now();
        const surviving = [];
        for (const anim of pendingAnimsRef.current) {
          const age = now2 - anim.startMs;
          if (anim.kind === 'entry') {
            if (age >= 600) continue;
            const n = nodeById.get(anim.nodeId);
            if (!n) { surviving.push(anim); continue; }
            const progress = age / 600;
            ctx.globalAlpha = progress;
            ctx.fillStyle = n.color;
            ctx.beginPath();
            ctx.arc(n.x, n.y, n.size * progress, 0, Math.PI * 2);
            ctx.fill();
            surviving.push(anim);
          } else if (anim.kind === 'pulse') {
            if (age >= 400) continue;
            const n = nodeById.get(anim.nodeId);
            if (!n) { surviving.push(anim); continue; }
            const t = age / 400;
            const scale = t < 0.5 ? 1 + 0.3 * (t * 2) : 1 + 0.3 * (2 - t * 2);
            ctx.globalAlpha = 0.6;
            ctx.fillStyle = n.color;
            ctx.beginPath();
            ctx.arc(n.x, n.y, n.size * scale, 0, Math.PI * 2);
            ctx.fill();
            surviving.push(anim);
          } else if (anim.kind === 'edge') {
            if (age >= 800) continue;
            surviving.push(anim);
          }
        }
        pendingAnimsRef.current = surviving;
      }

      ctx.restore();
    }

    // ── hitTest ───────────────────────────────────────────────────────────────────
    function hitTest(clientX, clientY, rect, view, nodes) {
      const wx = (clientX - rect.left - view.x) / view.k;
      const wy = (clientY - rect.top - view.y) / view.k;
      let closest = null, minD2 = Infinity;
      for (const n of nodes) {
        const dx = n.x - wx, dy = n.y - wy;
        const d2 = dx * dx + dy * dy;
        const threshold = n.size + 4;
        if (d2 < threshold * threshold && d2 < minD2) { minD2 = d2; closest = n; }
      }
      return { node: closest, wx, wy };
    }

    // ── BrainGraph ────────────────────────────────────────────────────────────────
    function BrainGraph({ nodes, edges, lastError, isLoading, lastFetchedAt, onRefresh, focus, setFocus, activatedAtRef, paused, l2Recents, pendingAnimsRef, animationsEnabled }) {
      const wrapRef = React.useRef(null);
      const canvasRef = React.useRef(null);
      const [size, setSize] = React.useState({ w: 600, h: 400 });
      const viewRef = React.useRef({ x: 0, y: 0, k: 1 });
      const dragNodeRef = React.useRef(null);
      const mouseDownRef = React.useRef(null);
      const panStartRef = React.useRef(null);

      function handleMouseDown(e) {
        if (e.button !== 0) return;
        const rect = canvasRef.current.getBoundingClientRect();
        const { node, wx, wy } = hitTest(e.clientX, e.clientY, rect, viewRef.current, nodes);
        mouseDownRef.current = { x: e.clientX, y: e.clientY, wx, wy, node };
        if (node) {
          node.fx = wx; node.fy = wy;
          dragNodeRef.current = node;
        } else {
          panStartRef.current = { x: e.clientX, y: e.clientY, vx: viewRef.current.x, vy: viewRef.current.y };
        }
      }

      function handleMouseMove(e) {
        if (!mouseDownRef.current) return;
        const { node } = mouseDownRef.current;
        if (node) {
          const rect = canvasRef.current.getBoundingClientRect();
          const wx = (e.clientX - rect.left - viewRef.current.x) / viewRef.current.k;
          const wy = (e.clientY - rect.top - viewRef.current.y) / viewRef.current.k;
          node.fx = wx; node.fy = wy;
        } else if (panStartRef.current) {
          viewRef.current.x = panStartRef.current.vx + (e.clientX - panStartRef.current.x);
          viewRef.current.y = panStartRef.current.vy + (e.clientY - panStartRef.current.y);
        }
      }

      function handleMouseUp(e) {
        if (!mouseDownRef.current) return;
        const { x, y, node } = mouseDownRef.current;
        const moved = Math.hypot(e.clientX - x, e.clientY - y);
        if (node) {
          node.fx = null; node.fy = null;
          dragNodeRef.current = null;
          if (moved < 3) {
            setFocus(prev => prev === node.id ? null : node.id);
          }
        } else {
          if (moved < 3) setFocus(null);
          panStartRef.current = null;
        }
        mouseDownRef.current = null;
      }

      function handleMouseLeave() {
        if (mouseDownRef.current?.node) {
          const n = mouseDownRef.current.node;
          n.fx = null; n.fy = null;
          dragNodeRef.current = null;
        }
        panStartRef.current = null;
        mouseDownRef.current = null;
      }

      // Wheel listener attached imperatively with { passive: false }
      // so e.preventDefault() suppresses the page scroll. React's onWheel
      // is passive by default since v17.
      React.useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const handler = (e) => {
          e.preventDefault();
          const rect = canvas.getBoundingClientRect();
          const mx = e.clientX - rect.left;
          const my = e.clientY - rect.top;
          const factor = Math.exp(-e.deltaY * 0.001);
          const newK = Math.max(0.4, Math.min(3, viewRef.current.k * factor));
          const wx = (mx - viewRef.current.x) / viewRef.current.k;
          const wy = (my - viewRef.current.y) / viewRef.current.k;
          viewRef.current.x = mx - wx * newK;
          viewRef.current.y = my - wy * newK;
          viewRef.current.k = newK;
        };
        canvas.addEventListener('wheel', handler, { passive: false });
        return () => canvas.removeEventListener('wheel', handler);
      }, [size]);

      React.useEffect(() => {
        const el = wrapRef.current;
        if (!el) return;
        const ro = new ResizeObserver(() => {
          const w = el.clientWidth || 600;
          const h = el.clientHeight || 400;
          setSize({ w, h });
          if (canvasRef.current) {
            canvasRef.current.width = w;
            canvasRef.current.height = h;
          }
        });
        ro.observe(el);
        const w = el.clientWidth || 600;
        const h = el.clientHeight || 400;
        setSize({ w, h });
        if (canvasRef.current) { canvasRef.current.width = w; canvasRef.current.height = h; }
        return () => ro.disconnect();
      }, []);

      const nodeById = React.useMemo(
        () => new Map(nodes.map(n => [n.id, n])),
        [nodes]
      );

      React.useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas || nodes.length === 0) return;
        const ctx = canvas.getContext('2d');
        let rafId;

        const tick = () => {
          if (!paused) {
            simulate(nodes, edges, size, dragNodeRef.current, nodeById);
            render(ctx, nodes, edges, viewRef.current, activatedAtRef.current, focus, nodeById, l2Recents, pendingAnimsRef, animationsEnabled);
          }
          rafId = requestAnimationFrame(tick);
        };
        rafId = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(rafId);
      }, [nodes, edges, size, paused, focus, nodeById, activatedAtRef, l2Recents, pendingAnimsRef, animationsEnabled]);

      if (lastError === 'graph too large') {
        return (
          <div ref={wrapRef} style={{ position: 'relative', width: '100%', height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--fg)', opacity: 0.5, fontSize: '12px' }}>
            graph too large to render — use search instead
          </div>
        );
      }
      if (lastError) {
        return (
          <div ref={wrapRef} style={{ position: 'relative', width: '100%', height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--err)', fontSize: '12px' }}>
            ouch — failed to load graph: {lastError}
          </div>
        );
      }

      return (
        <div ref={wrapRef} style={{ position: 'relative', width: '100%', height: '100%', overflow: 'hidden' }}>
          <canvas
            ref={canvasRef}
            width={size.w}
            height={size.h}
            style={{ display: 'block', cursor: panStartRef.current ? 'grabbing' : 'grab' }}
            onMouseDown={handleMouseDown}
            onMouseMove={handleMouseMove}
            onMouseUp={handleMouseUp}
            onMouseLeave={handleMouseLeave}
          />
          <button
            onMouseDown={e => e.stopPropagation()}
            onClick={onRefresh}
            disabled={isLoading}
            style={{
              position: 'absolute', top: '8px', right: '8px',
              background: 'rgba(255,255,255,0.08)', border: '1px solid rgba(255,255,255,0.15)',
              color: 'var(--fg)', borderRadius: '4px', padding: '3px 8px',
              cursor: isLoading ? 'default' : 'pointer',
              fontFamily: 'var(--font)', fontSize: '11px', display: 'flex', gap: '6px', alignItems: 'center',
            }}
          >
            {isLoading ? 'loading…' : '↻ refresh'}
            {!isLoading && lastFetchedAt && (
              <span style={{ opacity: 0.5 }}>
                {formatRelative(new Date(lastFetchedAt).toISOString())}
              </span>
            )}
          </button>
        </div>
      );
    }

    // ── ThoughtStream ─────────────────────────────────────────────────────────────
    function ThoughtStream({ events, focus, setFocus }) {
      function badgeColor(type) {
        if (type === 'hook_wake_up') return 'var(--ok)';
        if (type === 'hook_post_turn') return 'var(--accent)';
        if (type.includes('reject')) return 'var(--swap)';
        if (type.includes('error') || type.includes('failed')) return 'var(--err)';
        return '#555';
      }

      const filtered = focus
        ? events.filter(ev => ev.node_id === focus || ev.metadata?.entry_id === focus)
        : events;

      return (
        <div className="thought-stream">
          <div style={{
            padding: '6px 10px',
            borderBottom: '1px solid rgba(255,255,255,0.08)',
            display: 'flex', alignItems: 'center', justifyContent: 'space-between',
            background: 'rgba(255,255,255,0.02)', flexShrink: 0,
            fontSize: '11px',
          }}>
            {focus ? (
              <>
                <span style={{ color: 'var(--accent)' }}>focused: {focus.slice(0, 8)}</span>
                <button
                  onClick={() => setFocus(null)}
                  style={{ background: 'none', border: 'none', color: 'var(--fg)', cursor: 'pointer', padding: '0 4px', fontSize: '12px' }}
                >×</button>
              </>
            ) : (
              <span style={{ opacity: 0.5 }}>all events</span>
            )}
          </div>
          <ul style={{ listStyle: 'none', overflowY: 'auto', flex: 1, padding: '4px 0' }}>
            {filtered.map((ev, i) => {
              const type = ev.event_type ?? '';
              const details = (ev.details ?? '').slice(0, 40);
              const meta = ev.metadata ?? {};
              return (
                <li key={`${ev.timestamp}-${i}`} style={{
                  padding: '3px 10px',
                  borderBottom: '1px solid rgba(255,255,255,0.04)',
                  fontSize: '11px',
                  display: 'flex', flexWrap: 'wrap', gap: '4px', alignItems: 'baseline',
                }}>
                  <span style={{ padding: '0 3px', borderRadius: '2px', background: badgeColor(type), color: '#000', fontSize: '10px', flexShrink: 0 }}>
                    {type}
                  </span>
                  <span style={{ opacity: 0.7, flexShrink: 0 }}>{ev.agent ?? ''}</span>
                  {details && <span style={{ opacity: 0.6, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', maxWidth: '120px' }}>{details}</span>}
                  {meta.duration_ms != null && <span style={{ opacity: 0.45, flexShrink: 0 }}>{meta.duration_ms}ms</span>}
                  {meta.tokens_approx != null && <span style={{ opacity: 0.45, flexShrink: 0 }}>{meta.tokens_approx}t</span>}
                  <span style={{ opacity: 0.4, flexShrink: 0, marginLeft: 'auto' }}>{formatRelative(ev.timestamp)}</span>
                </li>
              );
            })}
          </ul>
        </div>
      );
    }

    // ── ClusterMeters ─────────────────────────────────────────────────────────────
    function ClusterMeters({ stats }) {
      const prevRef = React.useRef({});

      const total = stats?.total ?? 0;
      const entries = Object.entries(stats?.types ?? {})
        .sort(([, a], [, b]) => b - a)
        .slice(0, 8);

      const arrows = entries.map(([type, count]) => {
        const prev = prevRef.current[type];
        if (prev === undefined) return { type, count, arrow: '→', cls: 'trend-flat' };
        if (count > prev) return { type, count, arrow: '↑', cls: 'trend-up' };
        if (count < prev) return { type, count, arrow: '↓', cls: 'trend-down' };
        return { type, count, arrow: '→', cls: 'trend-flat' };
      });

      React.useEffect(() => {
        prevRef.current = stats?.types ?? {};
      }, [stats]);

      return (
        <div className="cluster-meters">
          {arrows.map(({ type, count, arrow, cls }) => (
            <div key={type} className="meter-row">
              <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', opacity: 0.8 }}>{type}</span>
              <div className="meter-bar">
                <span style={{ width: `${total > 0 ? (count / total) * 100 : 0}%`, background: paletteFor(type) }} />
              </div>
              <span style={{ fontVariantNumeric: 'tabular-nums', minWidth: '24px', textAlign: 'right' }}>{count}</span>
              <span className={cls}>{arrow}</span>
            </div>
          ))}
        </div>
      );
    }

    // ── TopAccessed ───────────────────────────────────────────────────────────────
    function TopAccessed({ entries, focus, setFocus }) {
      const top10 = [...(entries ?? [])]
        .sort((a, b) => (b.access_count ?? 0) - (a.access_count ?? 0))
        .slice(0, 10);

      return (
        <ul className="top-accessed">
          {top10.map(entry => {
            const raw = entry.content ?? '';
            const snippet = raw.slice(0, 40) + (raw.length > 40 ? '…' : '');
            const isFocused = focus === entry.id;
            return (
              <li
                key={entry.id}
                className={isFocused ? 'focused' : ''}
                onClick={() => setFocus(isFocused ? null : entry.id)}
              >
                <span className="dot" style={{ background: paletteFor(entry.memory_type) }} />
                <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{snippet}</span>
                <span className="access-badge">{entry.access_count ?? 0}</span>
              </li>
            );
          })}
        </ul>
      );
    }

    // ── AgentTypeMatrix ───────────────────────────────────────────────────────────
    function AgentTypeMatrix({ entries }) {
      const [selected, setSelected] = React.useState(null);
      const wrapRef = React.useRef(null);
      const [svgSize, setSvgSize] = React.useState({ w: 600, h: 400 });

      React.useEffect(() => {
        const el = wrapRef.current;
        if (!el) return;
        const ro = new ResizeObserver(() => setSvgSize({ w: el.clientWidth || 600, h: el.clientHeight || 400 }));
        ro.observe(el);
        setSvgSize({ w: el.clientWidth || 600, h: el.clientHeight || 400 });
        return () => ro.disconnect();
      }, []);

      const { agents, types, counts, samples, maxCount } = React.useMemo(() => {
        const agentSet = new Set(), typeSet = new Set();
        const counts = {}, samples = {};
        let maxCount = 0;
        for (const e of entries || []) {
          const a = e.agent || '∅';
          const t = e.memory_type || 'default';
          agentSet.add(a); typeSet.add(t);
          counts[a] = counts[a] || {};
          counts[a][t] = (counts[a][t] || 0) + 1;
          const k = a + '\x00' + t;
          samples[k] = samples[k] || [];
          if (samples[k].length < 5) samples[k].push(e.id);
          if (counts[a][t] > maxCount) maxCount = counts[a][t];
        }
        return { agents: [...agentSet], types: [...typeSet], counts, samples, maxCount };
      }, [entries]);

      function truncLabel(label) {
        return label.length > 12 ? label.slice(0, 11) + '…' : label;
      }

      function cellAlpha(count) {
        if (!count) return 0;
        return Math.max(0.1, Math.log(count + 1) / Math.log(maxCount + 1));
      }

      const LABEL_GUTTER = 80;
      const TOP_GUTTER = 40;
      const cellW = agents.length > 0 ? (svgSize.w - LABEL_GUTTER) / agents.length : 0;
      const cellH = types.length > 0 ? (svgSize.h - TOP_GUTTER) / types.length : 0;

      return (
        <div ref={wrapRef} className="matrix-view">
          <svg
            width={svgSize.w}
            height={svgSize.h}
            onClick={e => { if (e.target.tagName === 'svg' || e.target.tagName === 'SVG') setSelected(null); }}
          >
            {agents.map((agent, ai) => (
              <text
                key={agent}
                x={LABEL_GUTTER + ai * cellW + cellW / 2}
                y={TOP_GUTTER - 6}
                textAnchor="middle"
                fontSize="9"
                fill="var(--dim)"
              >
                {truncLabel(agent)}
              </text>
            ))}
            {types.map((type, ti) => (
              <text
                key={type}
                x={LABEL_GUTTER - 4}
                y={TOP_GUTTER + ti * cellH + cellH / 2 + 4}
                textAnchor="end"
                fontSize="9"
                fill="var(--dim)"
              >
                {truncLabel(type)}
              </text>
            ))}
            {agents.map((agent, ai) =>
              types.map((type, ti) => {
                const count = (counts[agent] && counts[agent][type]) || 0;
                const alpha = cellAlpha(count);
                const k = agent + '\x00' + type;
                const sampleIds = samples[k] || [];
                const x = LABEL_GUTTER + ai * cellW;
                const y = TOP_GUTTER + ti * cellH;
                return (
                  <rect
                    key={k}
                    x={x}
                    y={y}
                    width={Math.max(1, cellW - 2)}
                    height={Math.max(1, cellH - 2)}
                    fill={`hsla(180, 60%, 50%, ${alpha})`}
                    style={{ cursor: count > 0 ? 'pointer' : 'default' }}
                    onClick={e => {
                      e.stopPropagation();
                      if (count === 0) return;
                      setSelected({ agent, type, count, sampleIds, x, y });
                    }}
                  />
                );
              })
            )}
          </svg>
          {selected && (
            <div
              className="cell-overlay"
              style={{ left: selected.x + LABEL_GUTTER, top: selected.y + TOP_GUTTER }}
            >
              {selected.agent} × {selected.type}{'\n'}count: {selected.count}{'\n'}samples: {selected.sampleIds.join(', ')}
            </div>
          )}
        </div>
      );
    }

    // ── MemoryTypeCooccurrence ────────────────────────────────────────────────────
    function MemoryTypeCooccurrence({ entries }) {
      const [selected, setSelected] = React.useState(null);
      const wrapRef = React.useRef(null);
      const [svgSize, setSvgSize] = React.useState({ w: 600, h: 400 });

      React.useEffect(() => {
        const el = wrapRef.current;
        if (!el) return;
        const ro = new ResizeObserver(() => setSvgSize({ w: el.clientWidth || 600, h: el.clientHeight || 400 }));
        ro.observe(el);
        setSvgSize({ w: el.clientWidth || 600, h: el.clientHeight || 400 });
        return () => ro.disconnect();
      }, []);

      const { types, matrix, samples, maxCount } = React.useMemo(() => {
        const typeSet = new Set();
        const nodeById = new Map((entries ?? []).map(e => [e.id, e]));
        const matrix = {};
        const samples = {};
        let maxCount = 0;

        for (const e of entries ?? []) {
          const mt = e.memory_type || 'default';
          typeSet.add(mt);
          const linkIds = e.links ? e.links.split(',').map(s => s.trim()).filter(Boolean) : [];
          for (const lid of linkIds) {
            const linked = nodeById.get(lid);
            if (!linked) continue;
            const lmt = linked.memory_type || 'default';
            typeSet.add(lmt);
            matrix[mt] = matrix[mt] ?? {};
            matrix[mt][lmt] = (matrix[mt][lmt] ?? 0) + 1;
            matrix[lmt] = matrix[lmt] ?? {};
            matrix[lmt][mt] = (matrix[lmt][mt] ?? 0) + 1;
            if (matrix[mt][lmt] > maxCount) maxCount = matrix[mt][lmt];

            const k = mt + '\x00' + lmt;
            samples[k] = samples[k] ?? [];
            if (samples[k].length < 5) samples[k].push(e.id);
          }
        }
        return { types: [...typeSet], matrix, samples, maxCount };
      }, [entries]);

      function cellAlpha(count) {
        if (!count) return 0;
        return Math.max(0.1, Math.log(count + 1) / Math.log(maxCount + 1));
      }

      function truncLabel(label) {
        return label.length > 12 ? label.slice(0, 11) + '…' : label;
      }

      const LABEL_GUTTER = 80;
      const TOP_GUTTER = 40;
      const cellW = types.length > 0 ? (svgSize.w - LABEL_GUTTER) / types.length : 0;
      const cellH = types.length > 0 ? (svgSize.h - TOP_GUTTER) / types.length : 0;

      return (
        <div ref={wrapRef} className="matrix-view">
          <svg
            width={svgSize.w}
            height={svgSize.h}
            onClick={e => { if (e.target.tagName === 'svg' || e.target.tagName === 'SVG') setSelected(null); }}
          >
            {types.map((type, ti) => (
              <text
                key={`col-${type}`}
                x={LABEL_GUTTER + ti * cellW + cellW / 2}
                y={TOP_GUTTER - 6}
                textAnchor="middle"
                fontSize="9"
                fill="var(--dim)"
              >
                {truncLabel(type)}
              </text>
            ))}
            {types.map((type, ti) => (
              <text
                key={`row-${type}`}
                x={LABEL_GUTTER - 4}
                y={TOP_GUTTER + ti * cellH + cellH / 2 + 4}
                textAnchor="end"
                fontSize="9"
                fill="var(--dim)"
              >
                {truncLabel(type)}
              </text>
            ))}
            {types.map((rowType, ri) =>
              types.map((colType, ci) => {
                const count = matrix[rowType]?.[colType] ?? 0;
                const alpha = cellAlpha(count);
                const k = rowType + '\x00' + colType;
                const sampleIds = samples[k] ?? [];
                const x = LABEL_GUTTER + ci * cellW;
                const y = TOP_GUTTER + ri * cellH;
                return (
                  <rect
                    key={k}
                    x={x}
                    y={y}
                    width={Math.max(1, cellW - 2)}
                    height={Math.max(1, cellH - 2)}
                    fill={`hsla(280, 60%, 50%, ${alpha})`}
                    style={{ cursor: count > 0 ? 'pointer' : 'default' }}
                    onClick={e => {
                      e.stopPropagation();
                      if (count === 0) return;
                      setSelected({ rowType, colType, count, sampleIds, x, y });
                    }}
                  />
                );
              })
            )}
          </svg>
          {selected && (
            <div
              className="cell-overlay"
              style={{ left: selected.x + LABEL_GUTTER, top: selected.y + TOP_GUTTER, pointerEvents: 'auto' }}
            >
              {selected.rowType} × {selected.colType}{'\n'}count: {selected.count}{'\n'}
              {selected.sampleIds.map(id => (
                <span
                  key={id}
                  style={{ cursor: 'pointer', color: 'var(--accent)', display: 'block' }}
                  onClick={() => { window.location.hash = '#/memory/' + id; }}
                >
                  {id.slice(0, 16)}…
                </span>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ── ConsoleView ───────────────────────────────────────────────────────────────
    function ConsoleView({ events }) {
      const preRef = React.useRef(null);
      const followingRef = React.useRef(true);
      const [showFollowPill, setShowFollowPill] = React.useState(false);

      React.useEffect(() => {
        const pre = preRef.current;
        if (!pre) return;
        if (followingRef.current) pre.scrollTop = pre.scrollHeight;
      }, [events]);

      function onScroll() {
        const pre = preRef.current;
        if (!pre) return;
        const atBottom = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 20;
        followingRef.current = atBottom;
        setShowFollowPill(!atBottom);
      }

      function jumpToBottom() {
        const pre = preRef.current;
        if (!pre) return;
        pre.scrollTop = pre.scrollHeight;
        followingRef.current = true;
        setShowFollowPill(false);
      }

      const newest100 = (events ?? []).slice(0, 100);
      return (
        <div className="console-wrap">
          <pre ref={preRef} onScroll={onScroll}>
            {newest100.map((e, i) => (
              <span key={i} className={`console-line console-${classifyEvent(e.event_type)}`}>
                {JSON.stringify(e)}{'\n'}
              </span>
            ))}
          </pre>
          {showFollowPill && (
            <button className="follow-pill" onClick={jumpToBottom}>↓ follow</button>
          )}
        </div>
      );
    }

    // ── LeftPanel ─────────────────────────────────────────────────────────────────
    function LeftPanel({ children }) {
      return (
        <div className="left-panel">
          {children}
        </div>
      );
    }

    // ── App ────────────────────────────────────────────────────────────────────────
    function App() {
      const startMs = useRef(Date.now()).current;
      const [docHidden, setDocHidden] = useState(document.hidden);
      const { tweaks, setTweaks } = useTweaks(TWEAK_DEFAULTS);
      const setTab = React.useCallback(name => setTweaks(t => ({ ...t, tab: name })), [setTweaks]);
      const [focus, setFocus] = useState(null);
      const [tweaksOpen, setTweaksOpen] = useState(false);
      const activatedAtRef = useRef({});
      const footerSearchRef = useRef(null);
      const pendingAnimsRef = useRef([]);
      const prevEventsForAnimRef = useRef([]);
      const prevEdgeKeysRef = useRef(new Set());

      useEffect(() => {
        const onVisibility = () => setDocHidden(document.hidden);
        document.addEventListener("visibilitychange", onVisibility);
        return () => document.removeEventListener("visibilitychange", onVisibility);
      }, []);

      const paused = docHidden || !tweaks.running;
      const { stats, queue, lastError: statsError } = useStats(tweaks.speed, paused);
      const { events, lastError: eventsError } = useEvents(tweaks.speed, paused);
      const graph = useGraph();
      const nodeSet = React.useMemo(() => new Set(graph.nodes.map(n => n.id)), [graph.nodes]);
      const thoughts = useThoughts(tweaks.speed, paused, nodeSet, activatedAtRef);
      const timeline = useTimeline();
      const lastError = statsError || eventsError;
      const agentFilter = tweaks.agentFilter ?? 'all';
      const filterByAgent = React.useCallback(
        (arr) => agentFilter === 'all' ? arr : (arr ?? []).filter(item => item.agent === agentFilter),
        [agentFilter]
      );
      const l2Recents = useL2Recents(events);

      useEffect(() => {
        if (!tweaks.animations) {
          prevEventsForAnimRef.current = events;
          prevEdgeKeysRef.current = new Set(graph.edges.map(([a, b]) => `${a}|${b}`));
          return;
        }
        const prevSet = new Set(prevEventsForAnimRef.current.map(e => e.event_id ?? e.timestamp));
        for (const ev of events) {
          const key = ev.event_id ?? ev.timestamp;
          if (prevSet.has(key)) continue;
          const nodeId = ev.metadata?.entry_id ?? ev.node_id ?? null;
          if (!nodeId) continue;
          const kind =
            ev.event_type === 'stored' ? 'entry' :
            ev.event_type === 'reinforced' ? 'pulse' :
            null;
          if (!kind) continue;
          const anims = pendingAnimsRef.current;
          if (anims.length >= ANIM_CAP) anims.shift();
          anims.push({ kind, nodeId, startMs: Date.now() });
        }
        prevEventsForAnimRef.current = events;

        const currentEdgeKeys = new Set(
          graph.edges.map(([a, b]) => `${a}|${b}`)
        );
        for (const key of currentEdgeKeys) {
          if (!prevEdgeKeysRef.current.has(key)) {
            const anims = pendingAnimsRef.current;
            if (anims.length >= ANIM_CAP) anims.shift();
            anims.push({ kind: 'edge', edgeKey: key, startMs: Date.now() });
          }
        }
        prevEdgeKeysRef.current = currentEdgeKeys;
      }, [events, graph.edges, tweaks.animations]);

      useEffect(() => {
        function onKey(e) {
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
          if (e.key === 'g') setTweaks(t => ({ ...t, tab: 'graph' }));
          else if (e.key === 'm') setTweaks(t => ({ ...t, tab: 'matrix' }));
          else if (e.key === 'c') setTweaks(t => ({ ...t, tab: 'console' }));
          else if (e.key === ' ') { e.preventDefault(); setTweaks(t => ({ ...t, running: !t.running })); }
          else if (e.key === 'r') { graph.refresh(); }
          else if (e.key === 't') { setTweaksOpen(o => !o); }
          else if (e.key === 'Escape') { setFocus(null); }
          else if (e.key === '/') { e.preventDefault(); footerSearchRef.current?.focus(); }
        }
        document.addEventListener('keydown', onKey);
        return () => document.removeEventListener('keydown', onKey);
      }, [graph.refresh, setTweaks, setTweaksOpen, setFocus]);

      return (
        <div className="brain-shell" style={{ display: "contents" }}>
          <Header stats={stats} queue={queue} lastError={lastError} startMs={startMs} buckets={timeline.buckets} events={events} tab={tweaks.tab} setTab={setTab} tweaks={tweaks} setTweaks={setTweaks} />
          <LeftPanel>
            <ClusterMeters stats={stats} />
            <TopAccessed entries={graph.nodes} focus={focus} setFocus={setFocus} />
          </LeftPanel>
          <div className="center-area">
            <div className="tab-content">
              {tweaks.tab === 'graph' && (
                <BrainGraph
                  nodes={filterByAgent(graph.nodes)}
                  edges={graph.edges}
                  lastError={graph.lastError}
                  isLoading={graph.isLoading}
                  lastFetchedAt={graph.lastFetchedAt}
                  onRefresh={graph.refresh}
                  focus={focus}
                  setFocus={setFocus}
                  activatedAtRef={activatedAtRef}
                  paused={paused}
                  l2Recents={l2Recents}
                  pendingAnimsRef={pendingAnimsRef}
                  animationsEnabled={tweaks.animations !== false}
                />
              )}
              {tweaks.tab === 'matrix' && (
                <div style={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
                  <div className="tab-bar" style={{ flexShrink: 0 }}>
                    <button
                      className={tweaks.matrixSubview !== 'agents' ? 'active' : ''}
                      onClick={() => setTweaks(t => ({ ...t, matrixSubview: 'types' }))}
                    >
                      view: types
                    </button>
                    <button
                      className={tweaks.matrixSubview === 'agents' ? 'active' : ''}
                      onClick={() => setTweaks(t => ({ ...t, matrixSubview: 'agents' }))}
                    >
                      view: agents
                    </button>
                  </div>
                  <div style={{ flex: 1, minHeight: 0, position: 'relative' }}>
                    {tweaks.matrixSubview === 'agents'
                      ? <AgentTypeMatrix entries={graph.nodes} />
                      : <MemoryTypeCooccurrence entries={graph.nodes} />}
                  </div>
                </div>
              )}
              {tweaks.tab === 'console' && <ConsoleView events={events} />}
            </div>
          </div>
          <ThoughtStream
            events={filterByAgent(thoughts.events)}
            focus={focus}
            setFocus={setFocus}
          />
          <Footer events={filterByAgent(events)} searchRef={footerSearchRef} />
          <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} open={tweaksOpen} setOpen={setTweaksOpen} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
