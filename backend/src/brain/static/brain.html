<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>brain · live monitor</title>
  <style>
    :root {
      --bg: #0b0b0f;
      --fg: #c5c8d3;
      --accent: #6fd6c9;
      --mem: #b48ead;
      --swap: #ebcb8b;
      --ok: #a3be8c;
      --err: #bf616a;
      --dim: #5d6478;
      --l2: #c278d6;
      --font: "JetBrains Mono", ui-monospace, "Cascadia Code", monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 13px; }
    #root {
      display: grid;
      grid-template-columns: 280px 1fr 320px;
      grid-template-rows: auto 1fr 180px;
      height: 100vh;
    }
    .brain-shell { display: contents; }
    .header-row { grid-column: 1 / -1; }
    .footer-row { grid-column: 1 / -1; }
    .left-panel { display: flex; flex-direction: column; gap: 8px; padding: 8px; min-height: 0; border-right: 1px solid rgba(255,255,255,0.05); }
    .thought-stream {
      border-left: 1px solid rgba(255,255,255,0.05);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .cluster-meters .meter-row { display: grid; grid-template-columns: 80px 1fr auto auto; gap: 6px; align-items: center; height: 24px; font-size: 11px; }
    .cluster-meters .meter-bar { height: 6px; border-radius: 3px; background: #1a1d28; overflow: hidden; }
    .cluster-meters .meter-bar > span { display: block; height: 100%; }
    .cluster-meters .trend-up { color: var(--accent); }
    .cluster-meters .trend-down { color: var(--err); }
    .cluster-meters .trend-flat { color: var(--dim); }
    .top-accessed { flex: 1; min-height: 0; overflow-y: auto; list-style: none; padding: 0; margin: 0; }
    .top-accessed li { display: grid; grid-template-columns: 8px 1fr auto; gap: 6px; align-items: center; padding: 4px 6px; cursor: pointer; font-size: 11px; }
    .top-accessed li:hover { background: #161922; }
    .top-accessed li.focused { background: #1f2433; outline: 1px solid var(--accent); }
    .top-accessed .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .top-accessed .access-badge { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 10px; }
    .tab-bar { display: flex; gap: 4px; padding: 4px 8px; border-bottom: 1px solid #1a1d28; }
    .tab-bar button { background: transparent; border: 1px solid #2a2f3d; color: var(--fg); padding: 2px 10px; cursor: pointer; font-family: inherit; font-size: 11px; }
    .tab-bar button.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
    .center-area { display: flex; flex-direction: column; min-height: 0; }
    .center-area > .tab-content { flex: 1; min-height: 0; position: relative; }
    .matrix-view { width: 100%; height: 100%; position: relative; }
    .matrix-view .cell-overlay { position: absolute; background: #1a1d28; border: 1px solid #2a2f3d; padding: 6px 8px; font-size: 11px; pointer-events: none; white-space: pre; }
    .console-wrap { position: relative; height: 100%; }
    .console-wrap pre { height: 100%; margin: 0; padding: 6px 8px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; font-size: 10px; line-height: 1.4; background: #08090d; }
    .console-line.console-green { color: var(--ok); }
    .console-line.console-cyan { color: var(--accent); }
    .console-line.console-yellow { color: var(--swap); }
    .console-line.console-red { color: var(--err); }
    .console-line.console-grey { color: var(--dim); }
    .follow-pill { position: absolute; top: 8px; right: 8px; background: var(--accent); color: var(--bg); border: none; padding: 2px 8px; cursor: pointer; font-family: inherit; font-size: 10px; }
    .footer-search { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .footer-search input { background: #08090d; border: 1px solid #2a2f3d; color: var(--fg); padding: 2px 6px; font-family: inherit; font-size: 11px; min-width: 200px; outline: none; }
    .footer-search .matches-badge { color: var(--dim); font-size: 10px; font-variant-numeric: tabular-nums; }
    .tail-indicator { margin-left: auto; opacity: 0.45; font-style: italic; font-size: 10px; font-family: var(--font); }
    .empty-state { padding: 12px 16px; opacity: 0.45; font-style: italic; font-size: 11px; }
    .inspector-empty { padding: 16px; opacity: 0.5; font-style: italic; }
    .inspector h3 { font-size: 14px; padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.08); margin: 0; }
    .inspector-grid { display: grid; grid-template-columns: 120px 1fr; gap: 4px 12px; padding: 12px 16px; font-size: 11px; }
    .inspector-grid .label { color: var(--dim); }
    .inspector-section { padding: 8px 16px; border-top: 1px solid rgba(255,255,255,0.06); font-size: 11px; }
    .inspector-section h4 { font-size: 11px; color: var(--dim); margin-bottom: 6px; }
    .inspector-link { cursor: pointer; color: var(--accent); padding: 2px 0; display: block; }
  </style>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ── helpers ──────────────────────────────────────────────────────────────────
    function formatRelative(iso) {
      const diffSec = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
      if (diffSec < 60) return `${diffSec}s ago`;
      if (diffSec < 3600) return `${Math.floor(diffSec / 60)}m ago`;
      return `${Math.floor(diffSec / 3600)}h ago`;
    }

    function formatUptime(startMs) {
      const totalSec = Math.floor((Date.now() - startMs) / 1000);
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      return `${h}h:${String(m).padStart(2, "0")}m`;
    }

    function formatTime(iso) {
      return new Date(iso).toTimeString().slice(0, 8);
    }

    function classifyEvent(eventType) {
      const t = eventType ?? '';
      if (t === 'hook_wake_up') return 'green';
      if (t === 'hook_post_turn') return 'cyan';
      if (t.includes('reject')) return 'yellow';
      if (t.includes('error') || t.includes('failed')) return 'red';
      return 'grey';
    }

    // ── Layer helpers ─────────────────────────────────────────────────────────────
    function tagToLayer(tags) {
      const parts = (tags ?? '').split(',').map(s => s.trim());
      if (parts.includes('identity')) return 'L0';
      if (parts.includes('preference')) return 'L1';
      return null;
    }

    function inferLayer(node, l2RecentsMap) {
      if (l2RecentsMap && l2RecentsMap.has(node.id) && l2RecentsMap.get(node.id) > Date.now()) {
        return 'L2';
      }
      return tagToLayer(node.tags ?? '');
    }

    function layerRingColor(layer) {
      if (layer === 'L0') return '#dec56f';
      if (layer === 'L1') return '#6fd6c9';
      if (layer === 'L2') return '#c278d6';
      return null;
    }

    function useL2Recents(events) {
      return React.useMemo(() => {
        const map = new Map();
        const wakeUp = (events ?? []).find(e => e.event_type === 'hook_wake_up');
        if (!wakeUp) return map;
        const ids = wakeUp.metadata?.memory_ids?.L2 ?? [];
        const expiry = new Date(wakeUp.timestamp).getTime() + 60000;
        if (expiry <= Date.now()) return map;
        for (const id of ids) {
          map.set(id, expiry);
        }
        return map;
      }, [events]);
    }

    // ── Bar component ─────────────────────────────────────────────────────────────
    // htop-style ASCII meter [||||----]. width = char count.
    function Bar({ label, value, max, color, width = 14, redZone, suffix }) {
      const pct = Math.max(0, Math.min(1, value / Math.max(max, 1)));
      const filled = Math.max(0, Math.min(width, Math.round(pct * width)));
      const empty = width - filled;
      const isRed = redZone && value > redZone;
      const barColor = isRed ? "var(--err)" : color;
      return (
        <div style={{ display: "flex", alignItems: "center", gap: "8px", fontSize: "11px", lineHeight: 1.4 }}>
          {label && (
            <span style={{ color: "var(--dim)", width: "44px", flexShrink: 0 }}>{label}</span>
          )}
          <span style={{ fontFamily: "var(--font)", whiteSpace: "pre", letterSpacing: "1px" }}>
            <span style={{ color: "var(--dim)", opacity: 0.6 }}>[</span>
            <span style={{ color: barColor }}>{"|".repeat(filled)}</span>
            <span style={{ color: "var(--dim)", opacity: 0.4 }}>{"-".repeat(empty)}</span>
            <span style={{ color: "var(--dim)", opacity: 0.6 }}>]</span>
          </span>
          <span style={{ color: "var(--dim)", fontVariantNumeric: "tabular-nums", flexShrink: 0 }}>
            {suffix ?? `${(pct * 100).toFixed(0)}%`}
          </span>
        </div>
      );
    }

    // ── Header ────────────────────────────────────────────────────────────────────
    function Header({ stats, queue, lastError, startMs, buckets, events, tab, setTab, agentFilter, setAgentFilter }) {
      const total = stats?.total ?? 0;
      const allTypes = Object.entries(stats?.types ?? {})
        .sort(([, a], [, b]) => b - a);
      const cores = allTypes.slice(0, 4);

      const memUsed = total;
      const memMax = Math.max(1024, total * 1.5 || 1024);
      const swapValue = queue?.pending ?? 0;

      const eventsLast60s = (events ?? []).filter(
        e => Date.now() - new Date(e.timestamp).getTime() < 60000
      );
      const evtPerSec = (eventsLast60s.length / 60).toFixed(1);

      const lastWakeUp = (events ?? []).find(e => e.event_type === 'hook_wake_up');
      const l2Count = lastWakeUp?.metadata?.memory_ids?.L2?.length ?? 0;
      const l2Clickable = l2Count > 0 && lastWakeUp?.event_id;

      const coreColors = ["var(--accent)", "var(--ok)", "var(--mem)", "var(--swap)"];
      const coreCols = Math.max(1, cores.length);

      return (
        <header className="header-row" style={{
          borderBottom: "1px solid rgba(255,255,255,0.08)",
          background: "rgba(255,255,255,0.02)",
          display: "grid",
          gridTemplateColumns: "1fr auto",
          alignItems: "stretch",
        }}>
          {/* LEFT: row 1 = N cores · row 2 = mem | swap (each spans half) */}
          <div style={{
            padding: "8px 14px",
            display: "flex",
            flexDirection: "column",
            gap: "5px",
          }}>
            <div style={{
              display: "grid",
              gridTemplateColumns: `repeat(${coreCols}, minmax(0, 1fr))`,
              columnGap: "18px",
              rowGap: "3px",
            }}>
              {cores.map(([type, count], i) => (
                <Bar
                  key={`core-${type}`}
                  label={type.slice(0, 4)}
                  value={count}
                  max={total || 1}
                  color={coreColors[i % coreColors.length]}
                  width={20}
                  suffix={`${count}`}
                />
              ))}
            </div>
            <div style={{
              display: "grid",
              gridTemplateColumns: "1fr 1fr",
              columnGap: "18px",
            }}>
              <Bar
                label="mem"
                value={memUsed}
                max={memMax}
                color="var(--mem)"
                width={42}
                suffix={`${memUsed} / ${memMax}`}
              />
              <Bar
                label="swap"
                value={swapValue}
                max={100}
                color="var(--swap)"
                width={42}
                redZone={100}
                suffix={`${swapValue} pending`}
              />
            </div>
          </div>

          {/* RIGHT: identity + stats + tabs */}
          <div style={{
            padding: "8px 14px",
            display: "flex",
            flexDirection: "column",
            alignItems: "flex-end",
            gap: "4px",
            borderLeft: "1px solid rgba(255,255,255,0.08)",
            minWidth: "320px",
          }}>
            <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>
              <span style={{
                width: "8px", height: "8px", borderRadius: "50%",
                background: lastError ? "var(--err)" : "var(--ok)",
              }} title={lastError ?? "ok"} />
              <span style={{ color: "var(--fg)", fontWeight: 600, letterSpacing: "1px" }}>brain</span>
              <span style={{ color: "var(--dim)", fontSize: "11px" }}>v0.2</span>
              <span style={{ color: "var(--dim)" }}>·</span>
              <span style={{ color: "var(--accent)", fontSize: "11px" }}>pid 1</span>
              {l2Count > 0 && (
                <span
                  onClick={() => { if (l2Clickable) window.location.hash = '#/hook/' + lastWakeUp.event_id; }}
                  style={{
                    padding: "1px 6px",
                    borderRadius: "3px",
                    background: "var(--l2)",
                    color: "#000",
                    cursor: l2Clickable ? "pointer" : "default",
                    fontSize: "10px",
                    fontVariantNumeric: "tabular-nums",
                  }}
                >L2: {l2Count}</span>
              )}
            </div>
            <div style={{ display: "flex", gap: "12px", fontSize: "11px", color: "var(--dim)", fontVariantNumeric: "tabular-nums" }}>
              <span>up <span style={{ color: "var(--fg)" }}>{formatUptime(startMs)}</span></span>
              <span>thoughts <span style={{ color: "var(--fg)" }}>{(events ?? []).length}</span></span>
              <span>evt/s <span style={{ color: "var(--fg)" }}>{(eventsLast60s.length / 60).toFixed(1)}</span></span>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: "6px" }}>
              <ActivitySparkline buckets={buckets} />
              <select
                value={agentFilter}
                onChange={e => setAgentFilter(e.target.value)}
                style={{ background: "#08090d", color: "var(--fg)", border: "1px solid rgba(255,255,255,0.15)", fontFamily: "inherit", fontSize: "10px", padding: "1px 4px" }}
              >
                {Array.from(new Set(['all', ...(events ?? []).map(e => e.agent).filter(Boolean)])).sort().map(a => (
                  <option key={a} value={a}>{a}</option>
                ))}
              </select>
            </div>
            <div className="tab-bar" style={{ padding: 0, borderBottom: "none" }}>
              {['graph', 'matrix', 'console'].map(name => (
                <button
                  key={name}
                  className={tab === name ? 'active' : ''}
                  onClick={() => setTab(name)}
                >
                  {name}
                </button>
              ))}
            </div>
          </div>
        </header>
      );
    }

    // ── Footer ─────────────────────────────────────────────────────────────────────
    function Footer({ events, searchRef, lastError }) {
      const [filter, setFilter] = React.useState('');
      const filtered = filter === '' ? (events ?? []) : (events ?? []).filter(
        e => JSON.stringify(e).toLowerCase().includes(filter.toLowerCase())
      );

      const showEmpty = filter === '' && (events ?? []).length === 0 && !lastError;

      return (
        <footer className="footer-row" style={{
          borderTop: "1px solid rgba(255,255,255,0.08)",
          overflowY: "auto",
          padding: "0",
        }}>
          <div className="footer-search">
            <input
              type="search"
              placeholder="filter…"
              ref={searchRef}
              value={filter}
              onChange={e => setFilter(e.target.value)}
            />
            <span className="matches-badge">{filtered.length} / {(events ?? []).length} matches</span>
            <span className="tail-indicator">tail -f /var/log/brain/events.jsonl</span>
          </div>
          {showEmpty ? (
            <div className="empty-state">waiting for system events…</div>
          ) : (
            filtered.map((ev, i) => {
              const type = ev.event_type ?? "";
              let badgeColor = "#555";
              if (type === "hook_wake_up") badgeColor = "var(--ok)";
              else if (type === "hook_post_turn") badgeColor = "var(--accent)";
              else if (type.includes("reject")) badgeColor = "var(--swap)";
              else if (type.includes("error") || type.includes("failed")) badgeColor = "var(--err)";

              const details = (ev.details ?? "").slice(0, 120);
              return (
                <div key={i} style={{ display: "flex", gap: "8px", padding: "2px 12px", fontSize: "12px", borderBottom: "1px solid rgba(255,255,255,0.04)" }}>
                  <span style={{ padding: "0 4px", borderRadius: "2px", background: badgeColor, color: "#000", flexShrink: 0, fontSize: "10px" }}>
                    {type}
                  </span>
                  <span style={{ opacity: 0.7, flexShrink: 0 }}>{ev.agent ?? ""}</span>
                  <span style={{ flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                    {details}
                  </span>
                  <span style={{ opacity: 0.5, flexShrink: 0, fontSize: "11px" }}>
                    {formatRelative(ev.timestamp)}
                  </span>
                </div>
              );
            })
          )}
        </footer>
      );
    }

    const ANIM_CAP = 20;

    // ── Hooks ──────────────────────────────────────────────────────────────────────
    function useStats(speed, paused) {
      const [state, setState] = useState({ stats: null, queue: null, lastError: null });
      useEffect(() => {
        if (paused) return;
        const ctrl = new AbortController();
        const intervalMs = Math.round(5000 / speed);

        async function fetchData() {
          try {
            const [sr, qr] = await Promise.all([
              fetch("/stats", { signal: ctrl.signal }),
              fetch("/queue/status", { signal: ctrl.signal }),
            ]);
            const [statsData, queueData] = await Promise.all([sr.json(), qr.json()]);
            setState({ stats: statsData, queue: queueData, lastError: null });
          } catch (err) {
            if (err.name !== "AbortError") {
              setState(s => ({ ...s, lastError: err.message }));
            }
          }
        }

        fetchData();
        const id = setInterval(fetchData, intervalMs);
        return () => { clearInterval(id); ctrl.abort(); };
      }, [speed, paused]);
      return state;
    }

    // ── useThoughts ──────────────────────────────────────────────────────────────
    function useThoughts(speed, paused, nodeSet, activatedAtRef) {
      const [state, setState] = useState({ events: [], lastError: null });
      const prevEventsRef = useRef([]);

      useEffect(() => {
        if (paused) return;
        const ctrl = new AbortController();
        const intervalMs = Math.round(2000 / speed);

        async function fetchData() {
          try {
            const r = await fetch('/events?limit=20', { signal: ctrl.signal });
            const data = await r.json();
            const newEvents = [...(data.events ?? [])].reverse();

            const prevSet = new Set(prevEventsRef.current.map(e => e.timestamp));
            for (const ev of newEvents) {
              if (prevSet.has(ev.timestamp)) continue;
              const entryId = ev.metadata?.entry_id ?? (ev.node_id || null);
              if (entryId && nodeSet.has(entryId)) {
                activatedAtRef.current[entryId] = Date.now();
              }
            }
            prevEventsRef.current = newEvents;
            setState({ events: newEvents, lastError: null });
          } catch (err) {
            if (err.name !== 'AbortError') {
              setState(s => ({ ...s, lastError: err.message }));
            }
          }
        }

        fetchData();
        const id = setInterval(fetchData, intervalMs);
        return () => { clearInterval(id); ctrl.abort(); };
      }, [speed, paused, nodeSet]);

      return state;
    }

    // ── useTimeline ───────────────────────────────────────────────────────────────
    function useTimeline() {
      const [state, setState] = useState({ buckets: [], lastError: null });

      useEffect(() => {
        const ctrl = new AbortController();

        async function fetchData() {
          if (document.hidden) return;
          try {
            const r = await fetch('/events/timeline', { signal: ctrl.signal });
            const data = await r.json();
            setState({ buckets: data.timeline ?? [], lastError: null });
          } catch (err) {
            if (err.name !== 'AbortError') {
              setState(s => ({ ...s, lastError: err.message }));
            }
          }
        }

        fetchData();
        const id = setInterval(fetchData, 60000);
        return () => { clearInterval(id); ctrl.abort(); };
      }, []);

      return state;
    }

    // ── ActivitySparkline ─────────────────────────────────────────────────────────
    function ActivitySparkline({ buckets }) {
      const [tooltip, setTooltip] = useState(null);

      if (!buckets || buckets.length === 0) {
        return (
          <svg viewBox="0 0 120 16" width="120" height="16" style={{ flexShrink: 0 }}>
            <rect width="120" height="16" fill="var(--dim)" opacity="0.2" />
          </svg>
        );
      }

      const TYPES = ['archived', 'merged', 'reinforced', 'searched', 'stored'];
      const COLORS = {
        stored:     'var(--ok)',
        searched:   'var(--accent)',
        reinforced: '#7da9d8',
        merged:     'var(--swap)',
        archived:   'var(--dim)',
      };

      const totals = buckets.map(b => TYPES.reduce((s, t) => s + (b[t] ?? 0), 0));
      const maxTotal = Math.max(1, ...totals);

      const allZero = totals.every(t => t === 0);
      if (allZero) {
        return (
          <svg viewBox="0 0 120 16" width="120" height="16" style={{ flexShrink: 0 }}>
            <rect width="120" height="16" fill="var(--dim)" opacity="0.2" />
          </svg>
        );
      }

      const bars = buckets.map((b, i) => {
        const barX = i * 5;
        let yOff = 16;
        const rects = [];
        for (const t of TYPES) {
          const count = b[t] ?? 0;
          if (count === 0) continue;
          const h = (count / maxTotal) * 16;
          yOff -= h;
          rects.push(<rect key={t} x={barX} y={yOff} width="4" height={h} fill={COLORS[t]} />);
        }
        return (
          <g key={i}
            onMouseEnter={() => setTooltip({ i, x: barX, b })}
            onMouseLeave={() => setTooltip(null)}
            style={{ cursor: 'default' }}
          >
            {rects}
          </g>
        );
      });

      return (
        <div style={{ position: 'relative', display: 'inline-block' }}>
          <svg viewBox="0 0 120 16" width="120" height="16" style={{ flexShrink: 0, display: 'block' }}>
            {bars}
          </svg>
          {tooltip && (
            <div style={{
              position: 'absolute', bottom: '20px', left: `${tooltip.x}px`,
              background: 'rgba(10,10,18,0.95)', border: '1px solid rgba(255,255,255,0.15)',
              borderRadius: '3px', padding: '4px 6px', fontSize: '10px', whiteSpace: 'nowrap',
              pointerEvents: 'none', zIndex: 10,
            }}>
              {TYPES.filter(t => tooltip.b[t] > 0).map(t => (
                <div key={t}>{t}: {tooltip.b[t]}</div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function useEvents(speed, paused) {
      const [state, setState] = useState({ events: [], lastError: null });
      useEffect(() => {
        if (paused) return;
        const ctrl = new AbortController();
        const intervalMs = Math.round(2000 / speed);

        async function fetchData() {
          try {
            const r = await fetch("/events?limit=200", { signal: ctrl.signal });
            const data = await r.json();
            setState({ events: [...(data.events ?? [])].reverse(), lastError: null });
          } catch (err) {
            if (err.name !== "AbortError") {
              setState(s => ({ ...s, lastError: err.message }));
            }
          }
        }

        fetchData();
        const id = setInterval(fetchData, intervalMs);
        return () => { clearInterval(id); ctrl.abort(); };
      }, [speed, paused]);
      return state;
    }

    // ── useRawBuffer ─────────────────────────────────────────────────────────────
    // Polls /raw_buffer/recent — the L1 hippocampal stream of user_message,
    // assistant_message, tool_use events. This is what makes the monitor feel
    // alive while the agent works (the ChromaDB /events stream only updates
    // when Gemini extracts a fact, which is sparse).
    function useRawBuffer(speed, paused) {
      const [state, setState] = useState({ events: [], lastError: null });
      useEffect(() => {
        if (paused) return;
        const ctrl = new AbortController();
        const intervalMs = Math.max(1000, Math.round(1500 / speed));

        async function fetchData() {
          try {
            const r = await fetch("/raw_buffer/recent?limit=80&minutes=120", { signal: ctrl.signal });
            const data = await r.json();
            const events = [...(data.events ?? [])].reverse();
            setState({ events, lastError: null });
          } catch (err) {
            if (err.name !== "AbortError") {
              setState(s => ({ ...s, lastError: err.message }));
            }
          }
        }

        fetchData();
        const id = setInterval(fetchData, intervalMs);
        return () => { clearInterval(id); ctrl.abort(); };
      }, [speed, paused]);
      return state;
    }

    // ── paletteFor ───────────────────────────────────────────────────────────────
    function paletteFor(memoryType) {
      const P = {
        fact:         '#6fd6c9',
        preference:   '#b48ead',
        context:      '#ebcb8b',
        decision:     '#a3be8c',
        event:        '#88c0d0',
        strategy:     '#d08770',
        relationship: '#bf616a',
      };
      return P[memoryType] ?? '#5d6478';
    }

    // ── useGraph ─────────────────────────────────────────────────────────────────
    function useGraph() {
      const [state, setState] = React.useState({
        nodes: [], edges: [], lastError: null, lastFetchedAt: null, isLoading: false,
      });
      const fetchRef = React.useRef(null);

      function doFetch() {
        if (fetchRef.current) fetchRef.current.abort();
        const ctrl = new AbortController();
        fetchRef.current = ctrl;
        setState(s => ({ ...s, isLoading: true }));

        fetch('/graph', { signal: ctrl.signal })
          .then(r => r.json())
          .then(data => {
            const rawEntries = data.entries ?? [];
            if (rawEntries.length > 500) {
              setState({ nodes: [], edges: [], lastError: 'graph too large', lastFetchedAt: Date.now(), isLoading: false });
              return;
            }
            const nodeSet = new Set(rawEntries.map(e => e.id));
            const nodes = rawEntries.map(e => ({
              id: e.id,
              memory_type: e.memory_type,
              agent: e.agent ?? '∅',
              content: e.content ?? '',
              tags: e.metadata?.tags ?? '',
              links: e.links ?? '',
              color: paletteFor(e.memory_type),
              size: 4 + Math.log((e.access_count ?? 0) + 1) * 2,
              access_count: e.access_count ?? 0,
              x: Math.random(),
              y: Math.random(),
              seeded: false,
              vx: 0, vy: 0,
              fx: null, fy: null,
            }));
            const seen = new Set();
            const edges = [];
            rawEntries.forEach(e => {
              const linkIds = e.links ? e.links.split(',').map(s => s.trim()).filter(Boolean) : [];
              linkIds.forEach(lid => {
                if (!nodeSet.has(lid)) return;
                const key = e.id < lid ? `${e.id}|${lid}` : `${lid}|${e.id}`;
                if (seen.has(key)) return;
                seen.add(key);
                edges.push([e.id < lid ? e.id : lid, e.id < lid ? lid : e.id]);
              });
            });

            // Synthesize ghost edges between memories of the same type using
            // a Jaccard-on-words heuristic. Threshold 0.18 keeps the graph
            // readable (~2-3 edges per node max). Real backend-stored links
            // (above) take precedence: only add ghost if no real link exists.
            const STOP = new Set(['the','a','an','of','to','and','in','for','is','it','on','that','with','as','at','by','this','from','or','be','was','are','i','we','you','my','your']);
            function tokens(s) {
              return new Set(
                String(s ?? '').toLowerCase()
                  .replace(/[^a-z0-9\s]/g, ' ')
                  .split(/\s+/)
                  .filter(w => w.length > 2 && !STOP.has(w))
              );
            }
            const tokSets = rawEntries.map(e => tokens(e.content));
            const GHOST_THRESHOLD = 0.18;
            for (let i = 0; i < rawEntries.length; i++) {
              for (let j = i + 1; j < rawEntries.length; j++) {
                const a = rawEntries[i], b = rawEntries[j];
                if (a.memory_type !== b.memory_type) continue;
                const ta = tokSets[i], tb = tokSets[j];
                if (ta.size === 0 || tb.size === 0) continue;
                let inter = 0;
                for (const w of ta) if (tb.has(w)) inter++;
                const union = ta.size + tb.size - inter;
                const jacc = union > 0 ? inter / union : 0;
                if (jacc < GHOST_THRESHOLD) continue;
                const key = a.id < b.id ? `${a.id}|${b.id}` : `${b.id}|${a.id}`;
                if (seen.has(key)) continue;
                seen.add(key);
                edges.push([a.id < b.id ? a.id : b.id, a.id < b.id ? b.id : a.id, 'ghost', jacc]);
              }
            }

            setState({ nodes, edges, lastError: null, lastFetchedAt: Date.now(), isLoading: false });
          })
          .catch(err => {
            if (err.name === 'AbortError') return;
            setState(s => ({ ...s, lastError: err.message, isLoading: false }));
          });
      }

      React.useEffect(() => {
        doFetch();
        return () => { if (fetchRef.current) fetchRef.current.abort(); };
      }, []);

      return { ...state, refresh: doFetch };
    }

    // ── simulate ──────────────────────────────────────────────────────────────────
    // Forces are accumulated into fx/fy per tick (reset every frame), then integrated
    // into vx/vy with damping. Earlier versions accumulated forces into vx/vy directly,
    // which caused systematic drift toward the upper-left because residual unbalanced
    // forces compounded across frames instead of being recomputed from scratch.
    // Ported from tmp/BrainV2/brain-graph.jsx::simulateForces. Adapted: real memories
    // have no ontological hubs, so we synthesize one virtual hub per memory_type at a
    // fixed position on a ring around center. Each memory is sprung toward its type-hub.
    function simulate(nodes, edges, size, dragNode, nodeById) {
      const cx = size.w / 2, cy = size.h / 2;
      const REPULSE_SAME = 220;
      const REPULSE_CROSS = 380;
      const SPRING_K_EDGE = 0.02;
      const SPRING_TARGET_EDGE = 80;
      const HUB_PULL_K = 0.012;
      const HUB_SPRING_TARGET = 60;
      const CENTER_K = 0.0005;
      const DAMP = 0.78;
      const DT = 0.5;
      const MARGIN = 30;
      const ringR = Math.min(size.w, size.h) * 0.30;

      const types = Array.from(new Set(nodes.map(n => n.memory_type)));
      const hubByType = new Map();
      types.forEach((t, i) => {
        const angle = (i / Math.max(1, types.length)) * Math.PI * 2;
        hubByType.set(t, { x: cx + Math.cos(angle) * ringR, y: cy + Math.sin(angle) * ringR });
      });

      for (const n of nodes) {
        if (!n.seeded) {
          const hub = hubByType.get(n.memory_type);
          const r = 60 + Math.random() * 40;
          const a = Math.random() * Math.PI * 2;
          n.x = hub.x + Math.cos(a) * r;
          n.y = hub.y + Math.sin(a) * r;
          n.seeded = true;
        }
        n.fxAcc = 0; n.fyAcc = 0;
      }

      for (const n of nodes) {
        const hub = hubByType.get(n.memory_type);
        const dx = hub.x - n.x, dy = hub.y - n.y;
        const d = Math.sqrt(dx * dx + dy * dy) || 1;
        const f = (d - HUB_SPRING_TARGET) * HUB_PULL_K;
        n.fxAcc += (dx / d) * f;
        n.fyAcc += (dy / d) * f;
      }

      for (let i = 0; i < nodes.length; i++) {
        const a = nodes[i];
        for (let j = i + 1; j < nodes.length; j++) {
          const b = nodes[j];
          let dx = a.x - b.x, dy = a.y - b.y;
          let d2 = dx * dx + dy * dy;
          if (d2 < 0.01) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d2 = 1; }
          const sameType = a.memory_type === b.memory_type;
          const k = sameType ? REPULSE_SAME : REPULSE_CROSS;
          const d = Math.sqrt(d2);
          const f = k / d2;
          a.fxAcc += (dx / d) * f; a.fyAcc += (dy / d) * f;
          b.fxAcc -= (dx / d) * f; b.fyAcc -= (dy / d) * f;
        }
      }

      for (const [aId, bId] of edges) {
        const a = nodeById.get(aId), b = nodeById.get(bId);
        if (!a || !b) continue;
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.sqrt(dx * dx + dy * dy) || 1;
        const target = SPRING_TARGET_EDGE + (a.size + b.size) / 2;
        const f = (d - target) * SPRING_K_EDGE;
        a.fxAcc += (dx / d) * f; a.fyAcc += (dy / d) * f;
        b.fxAcc -= (dx / d) * f; b.fyAcc -= (dy / d) * f;
      }

      for (const n of nodes) {
        n.fxAcc += (cx - n.x) * CENTER_K;
        n.fyAcc += (cy - n.y) * CENTER_K;
      }

      for (const n of nodes) {
        if (n.x < MARGIN) n.fxAcc += (MARGIN - n.x) * 0.05;
        if (n.x > size.w - MARGIN) n.fxAcc += (size.w - MARGIN - n.x) * 0.05;
        if (n.y < MARGIN) n.fyAcc += (MARGIN - n.y) * 0.05;
        if (n.y > size.h - MARGIN) n.fyAcc += (size.h - MARGIN - n.y) * 0.05;
      }

      for (const n of nodes) {
        if (n === dragNode || n.fx != null) {
          n.x = n.fx; n.y = n.fy; n.vx = 0; n.vy = 0; continue;
        }
        n.vx = (n.vx + n.fxAcc) * DAMP;
        n.vy = (n.vy + n.fyAcc) * DAMP;
        n.x += n.vx * DT; n.y += n.vy * DT;
      }
    }

    // ── render ────────────────────────────────────────────────────────────────────
    function render(ctx, nodes, edges, view, activatedAt, focus, nodeById, l2Recents, pendingAnimsRef, animationsEnabled) {
      const now = Date.now();
      ctx.save();
      ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
      ctx.translate(view.x, view.y);
      ctx.scale(view.k, view.k);

      let edgeFocusSet = null;
      if (focus) {
        edgeFocusSet = new Set([focus]);
        for (const [aId, bId] of edges) {
          if (aId === focus) edgeFocusSet.add(bId);
          if (bId === focus) edgeFocusSet.add(aId);
        }
      }

      for (const edge of edges) {
        const aId = edge[0], bId = edge[1], kind = edge[2], score = edge[3];
        const a = nodeById.get(aId), b = nodeById.get(bId);
        if (!a || !b) continue;
        const inFocus = focus && (focus === aId || focus === bId);
        const eitherActive = (now - (activatedAt[aId] ?? 0) < 5000) || (now - (activatedAt[bId] ?? 0) < 5000);
        const isGhost = kind === 'ghost';
        const baseAlpha = isGhost ? (0.08 + (score ?? 0.2) * 0.4) : 0.5;
        ctx.globalAlpha = focus ? (inFocus ? 0.9 : 0.04) : (eitherActive ? Math.min(0.7, baseAlpha + 0.3) : baseAlpha);
        ctx.strokeStyle = isGhost ? a.color : (a.memory_type === b.memory_type ? a.color : '#3a3f4d');
        ctx.lineWidth = isGhost ? 0.7 : 1.1;
        if (isGhost) ctx.setLineDash([3, 3]); else ctx.setLineDash([]);
        ctx.beginPath();
        ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
      ctx.setLineDash([]);

      for (const n of nodes) {
        const t = activatedAt[n.id];
        if (!t) continue;
        const age = now - t;
        if (age >= 5000) continue;
        ctx.globalAlpha = 1 - age / 5000;
        ctx.fillStyle = n.color;
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.size + 6, 0, Math.PI * 2);
        ctx.fill();
      }

      const edgeSetTouchingFocus = edgeFocusSet;
      for (const n of nodes) {
        const dim = focus && focus !== n.id && !(edgeSetTouchingFocus && edgeSetTouchingFocus.has(n.id));
        ctx.globalAlpha = dim ? 0.18 : 1;
        ctx.fillStyle = n.color;
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.size, 0, Math.PI * 2);
        ctx.fill();
        if (focus === n.id) {
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      }

      // Layer ring pass — drawn after node fill so rings visually surround nodes
      const safeL2 = l2Recents ?? new Map();
      for (const n of nodes) {
        const layer = inferLayer(n, safeL2);
        const ringColor = layerRingColor(layer);
        if (!ringColor) continue;
        const dim = focus && focus !== n.id && !(edgeSetTouchingFocus && edgeSetTouchingFocus.has(n.id));
        ctx.globalAlpha = dim ? 0.18 : 1;
        ctx.strokeStyle = ringColor;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.size + 3, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Animation pass — only when animations enabled
      if (animationsEnabled && pendingAnimsRef) {
        const now2 = Date.now();
        const surviving = [];
        for (const anim of pendingAnimsRef.current) {
          const age = now2 - anim.startMs;
          if (anim.kind === 'entry') {
            if (age >= 600) continue;
            const n = nodeById.get(anim.nodeId);
            if (!n) { surviving.push(anim); continue; }
            const progress = age / 600;
            ctx.globalAlpha = progress;
            ctx.fillStyle = n.color;
            ctx.beginPath();
            ctx.arc(n.x, n.y, n.size * progress, 0, Math.PI * 2);
            ctx.fill();
            surviving.push(anim);
          } else if (anim.kind === 'pulse') {
            if (age >= 400) continue;
            const n = nodeById.get(anim.nodeId);
            if (!n) { surviving.push(anim); continue; }
            const t = age / 400;
            const scale = t < 0.5 ? 1 + 0.3 * (t * 2) : 1 + 0.3 * (2 - t * 2);
            ctx.globalAlpha = 0.6;
            ctx.fillStyle = n.color;
            ctx.beginPath();
            ctx.arc(n.x, n.y, n.size * scale, 0, Math.PI * 2);
            ctx.fill();
            surviving.push(anim);
          } else if (anim.kind === 'edge') {
            if (age >= 800) continue;
            surviving.push(anim);
          }
        }
        pendingAnimsRef.current = surviving;
      }

      ctx.restore();
    }

    // ── hitTest ───────────────────────────────────────────────────────────────────
    function hitTest(clientX, clientY, rect, view, nodes) {
      const wx = (clientX - rect.left - view.x) / view.k;
      const wy = (clientY - rect.top - view.y) / view.k;
      let closest = null, minD2 = Infinity;
      for (const n of nodes) {
        const dx = n.x - wx, dy = n.y - wy;
        const d2 = dx * dx + dy * dy;
        const threshold = n.size + 4;
        if (d2 < threshold * threshold && d2 < minD2) { minD2 = d2; closest = n; }
      }
      return { node: closest, wx, wy };
    }

    // ── BrainGraph ────────────────────────────────────────────────────────────────
    function BrainGraph({ nodes, edges, lastError, isLoading, lastFetchedAt, onRefresh, focus, setFocus, activatedAtRef, paused, l2Recents, pendingAnimsRef, animationsEnabled }) {
      const wrapRef = React.useRef(null);
      const canvasRef = React.useRef(null);
      const [size, setSize] = React.useState({ w: 600, h: 400 });
      const viewRef = React.useRef({ x: 0, y: 0, k: 1 });
      const dragNodeRef = React.useRef(null);
      const mouseDownRef = React.useRef(null);
      const panStartRef = React.useRef(null);

      function handleMouseDown(e) {
        if (e.button !== 0) return;
        const rect = canvasRef.current.getBoundingClientRect();
        const { node, wx, wy } = hitTest(e.clientX, e.clientY, rect, viewRef.current, nodes);
        mouseDownRef.current = { x: e.clientX, y: e.clientY, wx, wy, node };
        if (node) {
          node.fx = wx; node.fy = wy;
          dragNodeRef.current = node;
        } else {
          panStartRef.current = { x: e.clientX, y: e.clientY, vx: viewRef.current.x, vy: viewRef.current.y };
        }
      }

      function handleMouseMove(e) {
        if (!mouseDownRef.current) return;
        const { node } = mouseDownRef.current;
        if (node) {
          const rect = canvasRef.current.getBoundingClientRect();
          const wx = (e.clientX - rect.left - viewRef.current.x) / viewRef.current.k;
          const wy = (e.clientY - rect.top - viewRef.current.y) / viewRef.current.k;
          node.fx = wx; node.fy = wy;
        } else if (panStartRef.current) {
          viewRef.current.x = panStartRef.current.vx + (e.clientX - panStartRef.current.x);
          viewRef.current.y = panStartRef.current.vy + (e.clientY - panStartRef.current.y);
        }
      }

      function handleMouseUp(e) {
        if (!mouseDownRef.current) return;
        const { x, y, node } = mouseDownRef.current;
        const moved = Math.hypot(e.clientX - x, e.clientY - y);
        if (node) {
          node.fx = null; node.fy = null;
          dragNodeRef.current = null;
          if (moved < 3) {
            setFocus(prev => prev === node.id ? null : node.id);
            if (node.id) {
              window.location.hash = '#/memory/' + node.id;
            }
          }
        } else {
          if (moved < 3) setFocus(null);
          panStartRef.current = null;
        }
        mouseDownRef.current = null;
      }

      function handleMouseLeave() {
        if (mouseDownRef.current?.node) {
          const n = mouseDownRef.current.node;
          n.fx = null; n.fy = null;
          dragNodeRef.current = null;
        }
        panStartRef.current = null;
        mouseDownRef.current = null;
      }

      // Wheel listener attached imperatively with { passive: false }
      // so e.preventDefault() suppresses the page scroll. React's onWheel
      // is passive by default since v17.
      React.useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const handler = (e) => {
          e.preventDefault();
          const rect = canvas.getBoundingClientRect();
          const mx = e.clientX - rect.left;
          const my = e.clientY - rect.top;
          const factor = Math.exp(-e.deltaY * 0.001);
          const newK = Math.max(0.4, Math.min(3, viewRef.current.k * factor));
          const wx = (mx - viewRef.current.x) / viewRef.current.k;
          const wy = (my - viewRef.current.y) / viewRef.current.k;
          viewRef.current.x = mx - wx * newK;
          viewRef.current.y = my - wy * newK;
          viewRef.current.k = newK;
        };
        canvas.addEventListener('wheel', handler, { passive: false });
        return () => canvas.removeEventListener('wheel', handler);
      }, [size]);

      React.useEffect(() => {
        const el = wrapRef.current;
        if (!el) return;
        const ro = new ResizeObserver(() => {
          const w = el.clientWidth || 600;
          const h = el.clientHeight || 400;
          setSize({ w, h });
          if (canvasRef.current) {
            canvasRef.current.width = w;
            canvasRef.current.height = h;
          }
        });
        ro.observe(el);
        const w = el.clientWidth || 600;
        const h = el.clientHeight || 400;
        setSize({ w, h });
        if (canvasRef.current) { canvasRef.current.width = w; canvasRef.current.height = h; }
        return () => ro.disconnect();
      }, []);

      const nodeById = React.useMemo(
        () => new Map(nodes.map(n => [n.id, n])),
        [nodes]
      );

      React.useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas || nodes.length === 0) return;
        const ctx = canvas.getContext('2d');
        let rafId;

        const tick = () => {
          if (!paused) {
            simulate(nodes, edges, size, dragNodeRef.current, nodeById);
            render(ctx, nodes, edges, viewRef.current, activatedAtRef.current, focus, nodeById, l2Recents, pendingAnimsRef, animationsEnabled);
          }
          rafId = requestAnimationFrame(tick);
        };
        rafId = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(rafId);
      }, [nodes, edges, size, paused, focus, nodeById, activatedAtRef, l2Recents, pendingAnimsRef, animationsEnabled]);

      if (lastError === 'graph too large') {
        return (
          <div ref={wrapRef} style={{ position: 'relative', width: '100%', height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--fg)', opacity: 0.5, fontSize: '12px' }}>
            graph too large to render — use search instead
          </div>
        );
      }
      if (lastError) {
        return (
          <div ref={wrapRef} style={{ position: 'relative', width: '100%', height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--err)', fontSize: '12px' }}>
            ouch — failed to load graph: {lastError}
          </div>
        );
      }

      return (
        <div ref={wrapRef} style={{ position: 'relative', width: '100%', height: '100%', overflow: 'hidden' }}>
          <canvas
            ref={canvasRef}
            width={size.w}
            height={size.h}
            style={{ display: 'block', cursor: panStartRef.current ? 'grabbing' : 'grab' }}
            onMouseDown={handleMouseDown}
            onMouseMove={handleMouseMove}
            onMouseUp={handleMouseUp}
            onMouseLeave={handleMouseLeave}
          />
          <button
            onMouseDown={e => e.stopPropagation()}
            onClick={onRefresh}
            disabled={isLoading}
            style={{
              position: 'absolute', top: '8px', right: '8px',
              background: 'rgba(255,255,255,0.08)', border: '1px solid rgba(255,255,255,0.15)',
              color: 'var(--fg)', borderRadius: '4px', padding: '3px 8px',
              cursor: isLoading ? 'default' : 'pointer',
              fontFamily: 'var(--font)', fontSize: '11px', display: 'flex', gap: '6px', alignItems: 'center',
            }}
          >
            {isLoading ? 'loading…' : '↻ refresh'}
            {!isLoading && lastFetchedAt && (
              <span style={{ opacity: 0.5 }}>
                {formatRelative(new Date(lastFetchedAt).toISOString())}
              </span>
            )}
          </button>
        </div>
      );
    }

    // ── ThoughtStream ─────────────────────────────────────────────────────────────
    // Merges Brain extracted events (from /events) with the L1 raw stream
    // (from /raw_buffer/recent). Raw events show user prompts, assistant turns,
    // and tool uses in real time — this is what makes the monitor feel alive
    // even when Gemini hasn't extracted a fact in a while.
    function ThoughtStream({ events, rawEvents, focus, setFocus }) {
      function badgeColor(kind) {
        if (kind === 'user_message') return 'var(--accent)';
        if (kind === 'assistant_message') return 'var(--l2)';
        if (kind === 'tool_use') return '#5d6478';
        if (kind === 'hook_wake_up') return 'var(--ok)';
        if (kind === 'hook_post_turn') return 'var(--mem)';
        if (kind === 'stored') return 'var(--ok)';
        if (kind === 'reinforced') return 'var(--swap)';
        if ((kind ?? '').includes('reject')) return 'var(--swap)';
        if ((kind ?? '').includes('error') || (kind ?? '').includes('failed')) return 'var(--err)';
        return '#3a3f4d';
      }

      function badgeLabel(kind) {
        // Compact 4-char tags so the stream stays scannable.
        const map = {
          user_message: 'user',
          assistant_message: 'asst',
          tool_use: 'tool',
          hook_wake_up: 'wake',
          hook_post_turn: 'turn',
          degraded_wake_up: 'wake!',
          stored: 'sto',
          reinforced: 're',
          searched: 'srch',
        };
        return map[kind] ?? (kind ?? '').slice(0, 6);
      }

      const merged = React.useMemo(() => {
        const a = (events ?? []).map(ev => ({
          source: 'brain',
          ts: ev.timestamp,
          kind: ev.event_type ?? '',
          agent: ev.agent ?? '',
          content: ev.details ?? '',
          meta: ev.metadata ?? {},
          node_id: ev.node_id,
          event_id: ev.event_id,
        }));
        const b = (rawEvents ?? []).map(ev => ({
          source: 'raw',
          ts: ev.timestamp,
          kind: ev.kind ?? '',
          agent: ev.agent ?? '',
          content: ev.kind === 'tool_use' ? `${ev.tool_name ?? '?'} · ${(ev.content ?? '').slice(0, 60)}` : (ev.content ?? ''),
          meta: ev.metadata ?? {},
          event_id: ev.event_id,
        }));
        const all = [...a, ...b].sort((x, y) => new Date(y.ts).getTime() - new Date(x.ts).getTime());
        return all.slice(0, 200);
      }, [events, rawEvents]);

      const filtered = focus
        ? merged.filter(ev => ev.node_id === focus || ev.meta?.entry_id === focus)
        : merged;

      return (
        <div className="thought-stream">
          <div style={{
            padding: '6px 10px',
            borderBottom: '1px solid rgba(255,255,255,0.08)',
            display: 'flex', alignItems: 'center', justifyContent: 'space-between',
            background: 'rgba(255,255,255,0.02)', flexShrink: 0,
            fontSize: '11px',
          }}>
            {focus ? (
              <>
                <span style={{ color: 'var(--accent)' }}>focused: {focus.slice(0, 8)}</span>
                <button
                  onClick={() => setFocus(null)}
                  style={{ background: 'none', border: 'none', color: 'var(--fg)', cursor: 'pointer', padding: '0 4px', fontSize: '12px' }}
                >×</button>
              </>
            ) : (
              <span style={{ opacity: 0.5, display: 'flex', alignItems: 'center', gap: '6px' }}>
                <span className="blink" style={{ color: 'var(--ok)', fontSize: '10px' }}>●</span>
                live · {merged.length} events
              </span>
            )}
          </div>
          <ul style={{ listStyle: 'none', overflowY: 'auto', flex: 1, padding: '4px 0', margin: 0 }}>
            {filtered.map((ev, i) => {
              const isRaw = ev.source === 'raw';
              return (
                <li key={`${ev.event_id ?? ev.ts}-${i}`} style={{
                  padding: '3px 10px',
                  borderBottom: '1px solid rgba(255,255,255,0.04)',
                  fontSize: '11px',
                  display: 'flex', flexWrap: 'nowrap', gap: '6px', alignItems: 'baseline',
                  opacity: isRaw ? 1 : 0.85,
                }}>
                  <span style={{
                    padding: '0 4px', borderRadius: '2px',
                    background: badgeColor(ev.kind), color: '#000',
                    fontSize: '9px', flexShrink: 0, fontWeight: 600, letterSpacing: 0.5,
                    minWidth: '32px', textAlign: 'center',
                  }}>
                    {badgeLabel(ev.kind)}
                  </span>
                  <span style={{ flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', color: isRaw ? 'var(--fg)' : 'var(--dim)' }}>
                    {ev.content || (ev.agent ? `(${ev.agent})` : '')}
                  </span>
                  {ev.meta?.duration_ms != null && <span style={{ opacity: 0.45, flexShrink: 0 }}>{ev.meta.duration_ms}ms</span>}
                  <span style={{ opacity: 0.4, flexShrink: 0 }}>{formatRelative(ev.ts)}</span>
                </li>
              );
            })}
          </ul>
        </div>
      );
    }

    // ── ClusterMeters ─────────────────────────────────────────────────────────────
    function ClusterMeters({ stats }) {
      const prevRef = React.useRef({});

      const total = stats?.total ?? 0;
      const entries = Object.entries(stats?.types ?? {})
        .sort(([, a], [, b]) => b - a)
        .slice(0, 8);

      const arrows = entries.map(([type, count]) => {
        const prev = prevRef.current[type];
        if (prev === undefined) return { type, count, arrow: '→', cls: 'trend-flat' };
        if (count > prev) return { type, count, arrow: '↑', cls: 'trend-up' };
        if (count < prev) return { type, count, arrow: '↓', cls: 'trend-down' };
        return { type, count, arrow: '→', cls: 'trend-flat' };
      });

      React.useEffect(() => {
        prevRef.current = stats?.types ?? {};
      }, [stats]);

      return (
        <div className="cluster-meters">
          {arrows.map(({ type, count, arrow, cls }) => (
            <div key={type} className="meter-row">
              <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', opacity: 0.8 }}>{type}</span>
              <div className="meter-bar">
                <span style={{ width: `${total > 0 ? (count / total) * 100 : 0}%`, background: paletteFor(type) }} />
              </div>
              <span style={{ fontVariantNumeric: 'tabular-nums', minWidth: '24px', textAlign: 'right' }}>{count}</span>
              <span className={cls}>{arrow}</span>
            </div>
          ))}
        </div>
      );
    }

    // ── TopAccessed ───────────────────────────────────────────────────────────────
    function TopAccessed({ entries, focus, setFocus }) {
      const top10 = [...(entries ?? [])]
        .sort((a, b) => (b.access_count ?? 0) - (a.access_count ?? 0))
        .slice(0, 10);

      return (
        <ul className="top-accessed">
          {top10.map(entry => {
            const raw = entry.content ?? '';
            const snippet = raw.slice(0, 40) + (raw.length > 40 ? '…' : '');
            const isFocused = focus === entry.id;
            return (
              <li
                key={entry.id}
                className={isFocused ? 'focused' : ''}
                onClick={() => setFocus(isFocused ? null : entry.id)}
              >
                <span className="dot" style={{ background: paletteFor(entry.memory_type) }} />
                <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{snippet}</span>
                <span className="access-badge">{entry.access_count ?? 0}</span>
              </li>
            );
          })}
        </ul>
      );
    }

    // ── AgentTypeMatrix ───────────────────────────────────────────────────────────
    function AgentTypeMatrix({ entries }) {
      const [selected, setSelected] = React.useState(null);
      const wrapRef = React.useRef(null);
      const [svgSize, setSvgSize] = React.useState({ w: 600, h: 400 });

      React.useEffect(() => {
        const el = wrapRef.current;
        if (!el) return;
        const ro = new ResizeObserver(() => setSvgSize({ w: el.clientWidth || 600, h: el.clientHeight || 400 }));
        ro.observe(el);
        setSvgSize({ w: el.clientWidth || 600, h: el.clientHeight || 400 });
        return () => ro.disconnect();
      }, []);

      const { agents, types, counts, samples, maxCount } = React.useMemo(() => {
        const agentSet = new Set(), typeSet = new Set();
        const counts = {}, samples = {};
        let maxCount = 0;
        for (const e of entries || []) {
          const a = e.agent || '∅';
          const t = e.memory_type || 'default';
          agentSet.add(a); typeSet.add(t);
          counts[a] = counts[a] || {};
          counts[a][t] = (counts[a][t] || 0) + 1;
          const k = a + '\x00' + t;
          samples[k] = samples[k] || [];
          if (samples[k].length < 5) samples[k].push(e.id);
          if (counts[a][t] > maxCount) maxCount = counts[a][t];
        }
        return { agents: [...agentSet], types: [...typeSet], counts, samples, maxCount };
      }, [entries]);

      function truncLabel(label) {
        return label.length > 12 ? label.slice(0, 11) + '…' : label;
      }

      function cellAlpha(count) {
        if (!count) return 0;
        return Math.max(0.1, Math.log(count + 1) / Math.log(maxCount + 1));
      }

      const LABEL_GUTTER = 80;
      const TOP_GUTTER = 40;
      const cellW = agents.length > 0 ? (svgSize.w - LABEL_GUTTER) / agents.length : 0;
      const cellH = types.length > 0 ? (svgSize.h - TOP_GUTTER) / types.length : 0;

      return (
        <div ref={wrapRef} className="matrix-view">
          <svg
            width={svgSize.w}
            height={svgSize.h}
            onClick={e => { if (e.target.tagName === 'svg' || e.target.tagName === 'SVG') setSelected(null); }}
          >
            {agents.map((agent, ai) => (
              <text
                key={agent}
                x={LABEL_GUTTER + ai * cellW + cellW / 2}
                y={TOP_GUTTER - 6}
                textAnchor="middle"
                fontSize="9"
                fill="var(--dim)"
              >
                {truncLabel(agent)}
              </text>
            ))}
            {types.map((type, ti) => (
              <text
                key={type}
                x={LABEL_GUTTER - 4}
                y={TOP_GUTTER + ti * cellH + cellH / 2 + 4}
                textAnchor="end"
                fontSize="9"
                fill="var(--dim)"
              >
                {truncLabel(type)}
              </text>
            ))}
            {agents.map((agent, ai) =>
              types.map((type, ti) => {
                const count = (counts[agent] && counts[agent][type]) || 0;
                const alpha = cellAlpha(count);
                const k = agent + '\x00' + type;
                const sampleIds = samples[k] || [];
                const x = LABEL_GUTTER + ai * cellW;
                const y = TOP_GUTTER + ti * cellH;
                return (
                  <rect
                    key={k}
                    x={x}
                    y={y}
                    width={Math.max(1, cellW - 2)}
                    height={Math.max(1, cellH - 2)}
                    fill={`hsla(180, 60%, 50%, ${alpha})`}
                    style={{ cursor: count > 0 ? 'pointer' : 'default' }}
                    onClick={e => {
                      e.stopPropagation();
                      if (count === 0) return;
                      setSelected({ agent, type, count, sampleIds, x, y });
                    }}
                  />
                );
              })
            )}
          </svg>
          {selected && (
            <div
              className="cell-overlay"
              style={{ left: selected.x + LABEL_GUTTER, top: selected.y + TOP_GUTTER }}
            >
              {selected.agent} × {selected.type}{'\n'}count: {selected.count}{'\n'}samples: {selected.sampleIds.join(', ')}
            </div>
          )}
        </div>
      );
    }

    // ── MemoryTypeCooccurrence ────────────────────────────────────────────────────
    function MemoryTypeCooccurrence({ entries }) {
      const [selected, setSelected] = React.useState(null);
      const wrapRef = React.useRef(null);
      const [svgSize, setSvgSize] = React.useState({ w: 600, h: 400 });

      React.useEffect(() => {
        const el = wrapRef.current;
        if (!el) return;
        const ro = new ResizeObserver(() => setSvgSize({ w: el.clientWidth || 600, h: el.clientHeight || 400 }));
        ro.observe(el);
        setSvgSize({ w: el.clientWidth || 600, h: el.clientHeight || 400 });
        return () => ro.disconnect();
      }, []);

      const { types, matrix, samples, maxCount } = React.useMemo(() => {
        const typeSet = new Set();
        const nodeById = new Map((entries ?? []).map(e => [e.id, e]));
        const matrix = {};
        const samples = {};
        let maxCount = 0;

        for (const e of entries ?? []) {
          const mt = e.memory_type || 'default';
          typeSet.add(mt);
          const linkIds = e.links ? e.links.split(',').map(s => s.trim()).filter(Boolean) : [];
          for (const lid of linkIds) {
            const linked = nodeById.get(lid);
            if (!linked) continue;
            const lmt = linked.memory_type || 'default';
            typeSet.add(lmt);
            matrix[mt] = matrix[mt] ?? {};
            matrix[mt][lmt] = (matrix[mt][lmt] ?? 0) + 1;
            matrix[lmt] = matrix[lmt] ?? {};
            matrix[lmt][mt] = (matrix[lmt][mt] ?? 0) + 1;
            if (matrix[mt][lmt] > maxCount) maxCount = matrix[mt][lmt];

            const k = mt + '\x00' + lmt;
            samples[k] = samples[k] ?? [];
            if (samples[k].length < 5) samples[k].push(e.id);
          }
        }
        return { types: [...typeSet], matrix, samples, maxCount };
      }, [entries]);

      function cellAlpha(count) {
        if (!count) return 0;
        return Math.max(0.1, Math.log(count + 1) / Math.log(maxCount + 1));
      }

      function truncLabel(label) {
        return label.length > 12 ? label.slice(0, 11) + '…' : label;
      }

      const LABEL_GUTTER = 80;
      const TOP_GUTTER = 40;
      const cellW = types.length > 0 ? (svgSize.w - LABEL_GUTTER) / types.length : 0;
      const cellH = types.length > 0 ? (svgSize.h - TOP_GUTTER) / types.length : 0;

      return (
        <div ref={wrapRef} className="matrix-view">
          <svg
            width={svgSize.w}
            height={svgSize.h}
            onClick={e => { if (e.target.tagName === 'svg' || e.target.tagName === 'SVG') setSelected(null); }}
          >
            {types.map((type, ti) => (
              <text
                key={`col-${type}`}
                x={LABEL_GUTTER + ti * cellW + cellW / 2}
                y={TOP_GUTTER - 6}
                textAnchor="middle"
                fontSize="9"
                fill="var(--dim)"
              >
                {truncLabel(type)}
              </text>
            ))}
            {types.map((type, ti) => (
              <text
                key={`row-${type}`}
                x={LABEL_GUTTER - 4}
                y={TOP_GUTTER + ti * cellH + cellH / 2 + 4}
                textAnchor="end"
                fontSize="9"
                fill="var(--dim)"
              >
                {truncLabel(type)}
              </text>
            ))}
            {types.map((rowType, ri) =>
              types.map((colType, ci) => {
                const count = matrix[rowType]?.[colType] ?? 0;
                const alpha = cellAlpha(count);
                const k = rowType + '\x00' + colType;
                const sampleIds = samples[k] ?? [];
                const x = LABEL_GUTTER + ci * cellW;
                const y = TOP_GUTTER + ri * cellH;
                return (
                  <rect
                    key={k}
                    x={x}
                    y={y}
                    width={Math.max(1, cellW - 2)}
                    height={Math.max(1, cellH - 2)}
                    fill={`hsla(280, 60%, 50%, ${alpha})`}
                    style={{ cursor: count > 0 ? 'pointer' : 'default' }}
                    onClick={e => {
                      e.stopPropagation();
                      if (count === 0) return;
                      setSelected({ rowType, colType, count, sampleIds, x, y });
                    }}
                  />
                );
              })
            )}
          </svg>
          {selected && (
            <div
              className="cell-overlay"
              style={{ left: selected.x + LABEL_GUTTER, top: selected.y + TOP_GUTTER, pointerEvents: 'auto' }}
            >
              {selected.rowType} × {selected.colType}{'\n'}count: {selected.count}{'\n'}
              {selected.sampleIds.map(id => (
                <span
                  key={id}
                  style={{ cursor: 'pointer', color: 'var(--accent)', display: 'block' }}
                  onClick={() => { window.location.hash = '#/memory/' + id; }}
                >
                  {id.slice(0, 16)}…
                </span>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ── ConsoleView ───────────────────────────────────────────────────────────────
    function ConsoleView({ events }) {
      const preRef = React.useRef(null);
      const followingRef = React.useRef(true);
      const [showFollowPill, setShowFollowPill] = React.useState(false);

      React.useEffect(() => {
        const pre = preRef.current;
        if (!pre) return;
        if (followingRef.current) pre.scrollTop = pre.scrollHeight;
      }, [events]);

      function onScroll() {
        const pre = preRef.current;
        if (!pre) return;
        const atBottom = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 20;
        followingRef.current = atBottom;
        setShowFollowPill(!atBottom);
      }

      function jumpToBottom() {
        const pre = preRef.current;
        if (!pre) return;
        pre.scrollTop = pre.scrollHeight;
        followingRef.current = true;
        setShowFollowPill(false);
      }

      const newest100 = (events ?? []).slice(0, 100);
      return (
        <div className="console-wrap">
          <pre ref={preRef} onScroll={onScroll}>
            {newest100.map((e, i) => (
              <span key={i} className={`console-line console-${classifyEvent(e.event_type)}`}>
                {`[${formatTime(e.timestamp)}] ${(e.event_type ?? '').padEnd(20)} · ${(e.agent ?? '∅').padEnd(20)} · ${(e.details ?? '').slice(0, 80)}`}{'\n'}
              </span>
            ))}
          </pre>
          {showFollowPill && (
            <button className="follow-pill" onClick={jumpToBottom}>↓ follow</button>
          )}
        </div>
      );
    }

    // ── LeftPanel ─────────────────────────────────────────────────────────────────
    function LeftPanel({ children }) {
      return (
        <div className="left-panel">
          {children}
        </div>
      );
    }

    // ── MemoryInspector ───────────────────────────────────────────────────────────
    function MemoryInspector({ memId }) {
      const { nodes } = useGraph();
      const { events } = useEvents(1, false);
      const node = nodes.find(n => n.id === memId);

      if (!node) {
        return <div className="inspector-empty">memory {memId} not found in current graph</div>;
      }

      const linkIds = node.links
        ? node.links.split(',').map(s => s.trim()).filter(Boolean)
        : [];
      const nodeById = new Map(nodes.map(n => [n.id, n]));

      const lastWakeUp = (events ?? []).find(
        e => e.event_type === 'hook_wake_up' &&
             (e.metadata?.memory_ids?.L2 ?? []).includes(memId)
      );
      const cosineScore = lastWakeUp?.metadata?.cosine_scores?.[memId];

      return (
        <div className="inspector">
          <h3>{(node.content ?? memId).slice(0, 80)}</h3>
          <div className="inspector-grid">
            <span className="label">id</span><span style={{ wordBreak: 'break-all', opacity: 0.7 }}>{node.id}</span>
            <span className="label">memory_type</span>
            <span>
              <span style={{ display: 'inline-block', width: '8px', height: '8px', borderRadius: '50%', background: node.color, marginRight: '6px' }} />
              {node.memory_type ?? '—'}
            </span>
            <span className="label">tags</span><span style={{ opacity: 0.8 }}>{node.tags || '—'}</span>
            <span className="label">agent</span><span>{node.agent ?? '—'}</span>
            <span className="label">access_count</span><span>{node.access_count ?? 0}</span>
          </div>

          <div className="inspector-section">
            <h4>linked memories ({linkIds.length})</h4>
            {linkIds.length === 0 && <span style={{ opacity: 0.5 }}>none</span>}
            {linkIds.map(lid => {
              const linked = nodeById.get(lid);
              return (
                <span
                  key={lid}
                  className="inspector-link"
                  onClick={() => { window.location.hash = '#/memory/' + lid; }}
                >
                  <span style={{ display: 'inline-block', width: '6px', height: '6px', borderRadius: '50%', background: linked ? paletteFor(linked.memory_type) : 'var(--dim)', marginRight: '6px' }} />
                  {linked ? (linked.content ?? lid).slice(0, 60) : lid.slice(0, 16) + '…'}
                </span>
              );
            })}
          </div>

          <div className="inspector-section">
            <h4>L2 cosine score</h4>
            {lastWakeUp
              ? <span>cosine = {cosineScore != null ? cosineScore.toFixed(3) : '—'}</span>
              : <span style={{ opacity: 0.5 }}>not loaded by L2 recently</span>}
          </div>
        </div>
      );
    }

    // ── HookReplay ────────────────────────────────────────────────────────────────
    function HookReplay({ eventId }) {
      const { events } = useEvents(1, false);
      const event = (events ?? []).find(e => e.event_id === eventId);

      React.useEffect(() => {
        function handler(e) {
          if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
          const idx = (events ?? []).findIndex(ev => ev.event_id === eventId);
          if (idx === -1) return;
          if (e.key === 'j') {
            const next = events[idx - 1];
            if (next?.event_id) {
              history.pushState(null, '', '#/hook/' + next.event_id);
              window.dispatchEvent(new Event('hashchange'));
            }
          } else if (e.key === 'k') {
            const prev = events[idx + 1];
            if (prev?.event_id) {
              history.pushState(null, '', '#/hook/' + prev.event_id);
              window.dispatchEvent(new Event('hashchange'));
            }
          }
        }
        document.addEventListener('keydown', handler);
        return () => document.removeEventListener('keydown', handler);
      }, [events, eventId]);

      if (!event) {
        return <div className="inspector-empty">event {eventId} not in last 200</div>;
      }

      const layers = ['L0', 'L1', 'L2'];
      const memoryIds = event.metadata?.memory_ids ?? {};
      const tokensPer = event.metadata?.tokens_per_layer ?? {};
      const cosineScores = event.metadata?.cosine_scores ?? {};

      return (
        <div className="inspector">
          <h3>{event.event_type}</h3>
          <div className="inspector-grid">
            <span className="label">timestamp</span><span style={{ opacity: 0.7 }}>{event.timestamp}</span>
            <span className="label">agent</span><span>{event.agent ?? '—'}</span>
            <span className="label">event_id</span><span style={{ opacity: 0.7, wordBreak: 'break-all' }}>{event.event_id ?? '—'}</span>
          </div>

          <div className="inspector-section">
            <h4>request</h4>
            <pre style={{ fontSize: '10px', overflowX: 'auto', whiteSpace: 'pre-wrap', wordBreak: 'break-all', background: '#08090d', padding: '6px 8px', maxHeight: '120px', overflowY: 'auto' }}>
              {JSON.stringify(event.metadata?.request ?? {}, null, 2)}
            </pre>
          </div>

          <div className="inspector-section">
            <h4>response</h4>
            <pre style={{ fontSize: '10px', overflowX: 'auto', whiteSpace: 'pre-wrap', wordBreak: 'break-all', background: '#08090d', padding: '6px 8px', maxHeight: '120px', overflowY: 'auto' }}>
              {JSON.stringify(event.metadata?.response ?? event.metadata ?? {}, null, 2)}
            </pre>
          </div>

          <div className="inspector-section">
            <h4>per-layer breakdown</h4>
            <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '10px' }}>
              <thead>
                <tr>
                  {['layer', 'memory_ids', 'tokens', 'cosine_scores'].map(h => (
                    <th key={h} style={{ textAlign: 'left', padding: '2px 6px', color: 'var(--dim)', borderBottom: '1px solid rgba(255,255,255,0.08)' }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {layers.map(layer => {
                  const ids = memoryIds[layer] ?? [];
                  const tokens = tokensPer[layer];
                  const scores = layer === 'L2' ? cosineScores : null;
                  return (
                    <tr key={layer}>
                      <td style={{ padding: '3px 6px', color: layerRingColor(layer) ?? 'var(--fg)' }}>{layer}</td>
                      <td style={{ padding: '3px 6px', opacity: 0.8 }}>{ids.length > 0 ? ids.length + ' ids' : '—'}</td>
                      <td style={{ padding: '3px 6px', opacity: 0.8 }}>{tokens != null ? tokens : '—'}</td>
                      <td style={{ padding: '3px 6px', opacity: 0.8 }}>
                        {scores && Object.keys(scores).length > 0
                          ? Object.values(scores).map(v => v.toFixed(3)).join(', ')
                          : '—'}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
            <div style={{ marginTop: '6px', fontSize: '10px', color: 'var(--dim)' }}>j/k to navigate events</div>
          </div>
        </div>
      );
    }

    // ── AgentProfile ──────────────────────────────────────────────────────────────
    function AgentProfile({ name }) {
      const { nodes } = useGraph();
      const { events } = useEvents(1, false);

      const created = (nodes ?? []).filter(n => n.agent === name);

      const loadedIds = new Set();
      for (const ev of events ?? []) {
        if (ev.agent !== name || ev.event_type !== 'hook_wake_up') continue;
        for (const ids of Object.values(ev.metadata?.memory_ids ?? {})) {
          for (const id of ids) loadedIds.add(id);
        }
      }
      const loaded = (nodes ?? []).filter(n => loadedIds.has(n.id));
      const timeline = (events ?? []).filter(e => e.agent === name).slice(0, 50);

      return (
        <div className="inspector">
          <h3>{name}</h3>

          <div className="inspector-section">
            <h4>created memories ({created.length})</h4>
            {created.length === 0 && <span style={{ opacity: 0.5 }}>none</span>}
            {created.map(n => (
              <span
                key={n.id}
                className="inspector-link"
                onClick={() => { window.location.hash = '#/memory/' + n.id; }}
              >
                <span style={{ display: 'inline-block', width: '6px', height: '6px', borderRadius: '50%', background: n.color, marginRight: '6px' }} />
                {(n.content ?? n.id).slice(0, 60)}
              </span>
            ))}
          </div>

          <div className="inspector-section">
            <h4>loaded memories ({loaded.length})</h4>
            {loaded.length === 0 && <span style={{ opacity: 0.5 }}>none</span>}
            {loaded.map(n => (
              <span
                key={n.id}
                className="inspector-link"
                onClick={() => { window.location.hash = '#/memory/' + n.id; }}
              >
                <span style={{ display: 'inline-block', width: '6px', height: '6px', borderRadius: '50%', background: n.color, marginRight: '6px' }} />
                {(n.content ?? n.id).slice(0, 60)}
              </span>
            ))}
          </div>

          <div className="inspector-section">
            <h4>recent activity ({timeline.length})</h4>
            {timeline.map((ev, i) => {
              const isHook = ev.event_type?.startsWith('hook_');
              return (
                <span
                  key={i}
                  className={isHook ? 'inspector-link' : ''}
                  style={{ display: 'block', padding: '1px 0', fontSize: '10px', cursor: isHook ? 'pointer' : 'default' }}
                  onClick={() => {
                    if (isHook && ev.event_id) window.location.hash = '#/hook/' + ev.event_id;
                  }}
                >
                  [{formatTime(ev.timestamp)}] {(ev.event_type ?? '').padEnd(20)} · {(ev.details ?? '').slice(0, 40)}
                </span>
              );
            })}
          </div>
        </div>
      );
    }

    // ── HashRouter ────────────────────────────────────────────────────────────────
    function parseHash(hash) {
      let m;
      m = hash.match(/^#\/memory\/(.+)$/);
      if (m) return { route: 'memory', id: decodeURIComponent(m[1]) };
      m = hash.match(/^#\/hook\/(.+)$/);
      if (m) return { route: 'hook', id: decodeURIComponent(m[1]) };
      m = hash.match(/^#\/agent\/(.+)$/);
      if (m) return { route: 'agent', name: decodeURIComponent(m[1]) };
      return { route: null };
    }

    const RouteContext = React.createContext({ parsed: { route: null }, hash: '', closeDrawer: () => {} });

    function HashRouter({ children }) {
      const [hash, setHash] = React.useState(window.location.hash);

      React.useEffect(() => {
        const handler = () => setHash(window.location.hash);
        window.addEventListener('hashchange', handler);
        return () => window.removeEventListener('hashchange', handler);
      }, []);

      React.useEffect(() => {
        const handler = (e) => {
          const parsed = parseHash(window.location.hash);
          if (parsed.route && e.key === 'Escape') {
            e.stopImmediatePropagation();
            history.replaceState(null, '', window.location.pathname);
            window.dispatchEvent(new Event('hashchange'));
          }
        };
        document.addEventListener('keydown', handler, true);
        return () => document.removeEventListener('keydown', handler, true);
      }, []);

      const parsed = parseHash(hash);

      const closeDrawer = React.useCallback(() => {
        history.replaceState(null, '', window.location.pathname);
        window.dispatchEvent(new Event('hashchange'));
      }, []);

      const value = React.useMemo(() => ({ parsed, hash, closeDrawer }), [hash, closeDrawer, parsed.route, parsed.id, parsed.name]);

      return <RouteContext.Provider value={value}>{children}</RouteContext.Provider>;
    }

    function RouteInspector() {
      const { parsed, hash, closeDrawer } = React.useContext(RouteContext);
      if (!parsed.route) return null;

      let view = null;
      if (parsed.route === 'memory') view = <MemoryInspector memId={parsed.id} />;
      else if (parsed.route === 'hook') view = <HookReplay eventId={parsed.id} />;
      else if (parsed.route === 'agent') view = <AgentProfile name={parsed.name} />;

      return (
        <div className="thought-stream" style={{ overflow: 'hidden' }}>
          <div style={{
            padding: '6px 10px', borderBottom: '1px solid rgba(255,255,255,0.08)',
            display: 'flex', justifyContent: 'space-between', alignItems: 'center',
