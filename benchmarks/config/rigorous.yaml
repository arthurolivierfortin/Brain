# Rigorous run — premium judge, constrained reader. Opt-in.
# Reader = Haiku (constrained reasoning; forces Brain to contribute)
# Judge  = Opus (strict, minimal false-positive CORRECTs)
# Cost estimate: ~$22 per full 500Q run across all 3 adapters (none/raw/brain).
# Use when we want the most defensible numbers (e.g., if we ever decide to publish).
dataset: longmemeval_s
subset: null
adapter: brain
reader:
  provider: anthropic
  model: claude-haiku-4-5-20251001
judge:
  provider: anthropic
  model: claude-opus-4-7
brain_url: http://localhost:8621
chromadb_raw_persist_dir: ./runs/chromadb_raw
output_dir: ../docs/benchmarks
dry_run: false
seed: 42
