[project]
name = "brain-bench"
version = "0.1.0"
description = "Benchmarks harness for Brain (LongMemEval, Brain-Bench)"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=0.5.0",
    "httpx>=0.27",
    "ollama>=0.3",
    "anthropic>=0.42",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "mypy>=1.10",
    "ruff>=0.6",
    "types-tqdm>=4.66",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain_bench"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["src"]
