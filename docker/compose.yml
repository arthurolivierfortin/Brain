name: brain

services:
  brain:
    build:
      context: ..
      dockerfile: docker/Dockerfile.brain
    container_name: brain
    ports:
      # Host 8620/8621 to avoid collision with money-brain (8610/8611).
      # Internal service still listens on 8610/8611; update BRAIN_URL clients
      # to http://host.docker.internal:8621 (or use compose network).
      - "8620:8610"
      - "8621:8611"
    volumes:
      - brain-chromadb:/data/chromadb
    environment:
      BRAIN_HTTP_PORT: "8611"
      BRAIN_MCP_PORT: "8610"
      BRAIN_PERSIST_DIR: /data/chromadb
      BRAIN_SERVICE_HOST: brain
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    restart: unless-stopped

volumes:
  brain-chromadb:
